# Agregacao de logs - modo SingleBinary + filesystem (sem object storage),
# adequado pro volume de um homelab. Persiste via a mesma NFS storage class
# usada pelo resto do cluster.
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# Nao ha object storage - regras/ruler nao se aplicam aqui.
ruler:
  enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: nfs-slowbro
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

# Componentes de modo distribuido (SimpleScalable) - desligados no SingleBinary.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Cache memcached e desnecessario no volume de um homelab.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Canary/test exigem um segundo componente so pra validar escrita continua -
# dispensavel aqui.
lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
  selfMonitoring:
    enabled: false
