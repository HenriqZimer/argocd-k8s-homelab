# Agente que coleta os logs dos nos e envia pro Loki (mesmo namespace).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# -- Default do chart so tolera control-plane/master - sem isso, o taint
# nvidia.com/gpu no moltres (ver kubernetes-labels.tf) tiraria esse
# DaemonSet do unico node com GPU, perdendo os logs dele. Preserva as duas
# entradas default do chart e soma a nova.
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: nvidia.com/gpu
    value: present
    effect: NoSchedule
