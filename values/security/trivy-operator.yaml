# Scan continuo de vulnerabilidade nas imagens rodando no cluster.
trivy:
  ignoreUnfixed: true
  # Scan de imagens grandes estourava o limite padrao (500M) e morria OOMKilled.
  resources:
    requests:
      cpu: 100m
      memory: 256M
    limits:
      cpu: 500m
      memory: 1Gi

operator:
  replicas: 1
  # Reduz a carga do scan inicial num homelab pequeno.
  scanJobsConcurrentLimit: 2
  # Infra assessment / compliance (CIS) usam o node-collector, que monta
  # /etc/systemd, /etc/kubernetes etc. do host. No Talos o rootfs e read-only e
  # esses caminhos nao existem: o pod fica em CreateContainerError para sempre.
  # Scan de vulnerabilidade, config audit, RBAC e secrets continuam ligados.
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false

serviceMonitor:
  enabled: true
  # Necessário para o Prometheus do kube-prometheus-stack descobrir este ServiceMonitor.
  labels:
    release: kube-prometheus-stack

# Pod do operator: usa ~430-700Mi (VPA alvo 684Mi); sem limite antes.
resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 1Gi

# zapdos (8GB) chegou a 87% de requests e o OOM controller do Talos matava pods; o moltres
# (32GB) tem folga. Tolera o taint de GPU (nao usa a GPU) e prefere o moltres.
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [moltres]
