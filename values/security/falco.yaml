# Runtime security - detecta comportamento anomalo em containers/nos via eBPF.
driver:
  kind: modern_ebpf

collectors:
  containerEngine:
    engines:
      # Talos usa containerd puro (socket /run/containerd/containerd.sock,
      # ja coberto pelo engine "cri" default) - docker/podman nao existem.
      docker:
        enabled: false
      podman:
        enabled: false

falcosidekick:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi

tty: false

# -- Default do chart so tolera control-plane/master - sem isso, o taint
# nvidia.com/gpu no moltres (ver kubernetes-labels.tf) tiraria esse
# DaemonSet do unico node com GPU, perdendo a cobertura de seguranca dele.
# Preserva as duas entradas default do chart e soma a nova.
tolerations:
  - key: node-role.kubernetes.io/master
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
  - key: nvidia.com/gpu
    value: present
    effect: NoSchedule
