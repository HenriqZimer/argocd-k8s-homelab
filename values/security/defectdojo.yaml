# DefectDojo - gestao de vulnerabilidades (importa scans do Trivy etc.)
# Banco: cluster PostgreSQL compartilhado (CloudNativePG), banco "defectdojo".
# Secrets: todos via Vault/VSO (charts/defectdojo-extras); o chart nao cria nenhum
# (createSecret=false) porque o helm template do Argo regeraria senhas a cada sync.

host: defectdojo.henriqzimer.com.br
siteUrl: "https://defectdojo.henriqzimer.com.br"
imagePullPolicy: IfNotPresent

createSecret: false
createPostgresqlSecret: false
createValkeySecret: false

django:
  ingress:
    enabled: true
    ingressClassName: traefik
    # TLS vem do certificado wildcard (TLSStore default do Traefik)
    activateTLS: false
  # 2 workers do uwsgi bastam num homelab
  uwsgi:
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1Gi}
  nginx:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}

celery:
  worker:
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1Gi}
  beat:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 384Mi}

initializer:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

# Banco externo: nao sobe o PostgreSQL do chart.
postgresql:
  enabled: false
  auth:
    username: defectdojo
    database: defectdojo
    existingSecret: defectdojo-postgresql-specific
    secretKeys:
      userPasswordKey: postgresql-password
postgresServer: postgresql-rw.postgresql.svc.cluster.local

valkey:
  enabled: true
  auth:
    existingSecret: defectdojo-valkey-specific
    existingSecretPasswordKey: valkey-password
