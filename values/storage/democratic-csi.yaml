# democratic-csi - driver freenas-api-iscsi (TrueNAS via API REST)
# Backend: TrueNAS em 192.168.1.102, pool/dataset pai "slowbro/kubernetes"
#
# API key: gravar no Vault em k8s-homelab/truenas-api (chave api_key).
# Sem isso o Secret da config nao e criado e o controller nao sobe.
# Datasets "slowbro/kubernetes/vols" e "slowbro/kubernetes/snapshots"
# precisam existir no TrueNAS (ou o parent com permissao de criar filhos).
#
# StorageClass gerada: "freenas-iscsi" (RWO, nao-default). A default do
# cluster continua sendo a NFS (nfs-slowbro).

csiDriver:
  name: "org.democratic-csi.iscsi"

storageClasses:
  # Classe de bloco (RWO) para workloads sensiveis a latencia/IOPS:
  # Postgres, MySQL/MariaDB, Prometheus, Loki, Vault.
  # Nao e a default do cluster (essa e a NFS nfs-slowbro).
  # reclaimPolicy Retain: apagar o PVC NAO apaga o zvol no TrueNAS (o PV fica
  # Released e o dado continua em slowbro/kubernetes/vols). Limpeza e manual:
  # apagar o PV no cluster e depois o zvol no TrueNAS.
  - name: freenas-iscsi
    defaultClass: false
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: ext4
    mountOptions: []
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:

# A config do driver (inclusive a API key) vem do Secret
# democratic-csi-driver-config, gerado por charts/democratic-csi-extras a partir
# do Vault (k8s-homelab/truenas-api, chave api_key). Nada de segredo no Git.
driver:
  existingConfigSecret: democratic-csi-driver-config
  config:
    driver: freenas-api-iscsi # o chart so le o nome do driver daqui

# Talos: sem iscsiadm no host de forma tradicional. O node plugin entra no
# namespace do host (nsenter) e usa o iscsiadm da extension siderolabs/iscsi-tools.
# Requer a extension instalada nos workers (terraform-homelab, var
# talos_system_extensions).
# Imagem fixada pelo digest do build que ja roda (era "latest", tag movel). O
# digest 944d0e65... esta ACIMA de v1.9.5 (ultima release publicada); trocar
# para a tag v1.9.5 seria downgrade. Atualizar so de proposito, mudando o digest.
controller:
  driver:
    image:
      tag: "latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced"
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 512Mi}
  externalAttacher:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 256Mi}
  externalProvisioner:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 256Mi}
  externalResizer:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 256Mi}
  externalSnapshotter:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 256Mi}

csiProxy:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 128Mi}

node:
  hostPID: true
  driverRegistrar:
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 128Mi}
  # moltres (GPU) tem taint nvidia.com/gpu; sem tolerar, o node plugin nao sobe
  # la e nenhum pod com PVC iSCSI consegue montar volume nesse no.
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  driver:
    image:
      tag: "latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced"
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 512Mi}
    extraEnv:
      - name: ISCSIADM_HOST_STRATEGY
        value: nsenter
      - name: ISCSIADM_HOST_PATH
        value: /usr/local/sbin/iscsiadm
    # No Talos 1.13 + iscsi-tools o diretorio do host e /etc/iscsi (existe, com
    # initiatorname.iscsi); /usr/local/etc/iscsi nao existe e o rootfs e RO.
    # Type "" (sem checagem): o kubelet do Talos roda em outro mount namespace
    # e nao enxerga /etc/iscsi ("is not a directory" com type Directory).
    iscsiDirHostPath: /etc/iscsi
    iscsiDirHostPathType: ""
