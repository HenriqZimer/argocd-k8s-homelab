# Azahar (3DS) emulator - web KasmVNC desktop, no secrets/database needed
# so this app doesn't use the Vault pattern like romm.
#
# Sem streaming: nao existe Docker Mod de integracao com o RomM publicado
# pra esse chart ainda (ver comentario do values.yaml default do chart) -
# streaming.enabled fica false, sem STREAMING_BROKER_SECRET/DOCKER_MODS.
#
# persistence.config habilitada (PVC via nfs-slowbro) pra saves/config
# sobreviverem a um restart do pod.
#
# Ingress: exposto via Traefik sob henriqzimer.com.br, so LAN (requer DNS
# local - Pi-hole em 192.168.1.106 - apontando azahar-stream para
# 192.168.1.160, o LoadBalancer do Traefik nesse cluster).
#
# Sunshine/Moonlight (2026-08-20, POC): sunshine.enabled roda o Sunshine ao
# lado do Selkies, mesmo approach do dolphin (ver comentario la pro motivo
# completo). Detalhes: github.com/henriqzimer/azahar-sunshine-mod
# - PIXELFLUX_WAYLAND=false: a imagem roda em Wayland por padrao; Sunshine
#   so consegue capturar via Xorg (X11), nao Wayland.
# - hostNetwork/privileged (no bloco sunshine: abaixo): Moonlight fala
#   TCP+UDP cru (nao passa pelo Traefik) e o pod precisa da network
#   namespace do host pros eventos de hotplug do uinput chegarem no udev
#   dentro do container.
# - Acesso: parear o app Moonlight direto pelo IP do node moltres (o pod
#   fica na rede do host) - nao tem Service/Ingress pra essas portas.

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Sao_Paulo"
  TITLE: "Azahar"
  # -- Expoe a GPU NVIDIA do node pro container. O runtime "nvidia" ja e o
  # default do containerd em talos-worker-3 (ver locals.tf do
  # terraform-homelab), entao nao precisa de RuntimeClass nem do resource
  # extendido nvidia.com/gpu (que exigiria 1 GPU inteira por pod - com
  # varios emuladores + romm no mesmo node, so um deles conseguiria agendar).
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "all"
  # -- Docker Mod do Sunshine (POC).
  DOCKER_MODS: "ghcr.io/henriqzimer/azahar-sunshine-mod:latest"
  # -- Sockets Unix abstratos do X11 (@/tmp/.X11-unix/X1) sao compartilhados
  # pelo NETWORK NAMESPACE, nao pelo mount namespace do container - como
  # azahar e dolphin usam hostNetwork:true simultaneos no mesmo node, os
  # dois tentando :1 (default da imagem) colidem ("server already
  # running") mesmo estando em containers/filesystems totalmente
  # separados. Desloca o azahar pra :2 pra evitar a colisao.
  DISPLAY: ":2"
  # -- Obrigatorio pro Sunshine (ver comentario no topo do arquivo).
  PIXELFLUX_WAYLAND: "false"

# -- NAO desloque service.httpPort/httpsPort pra fugir da colisao com o
# dolphin (ja tentei - ver git blame): o nginx do Selkies dentro da
# imagem esta hardcoded pra escutar em 3000/3001, ignorando esse valor -
# so muda o Service/containerPort/probes do k8s, nunca o processo real.
# Confirmado: com o valor customizado, a liveness/readiness probe (que
# usa esse valor) apontava pra uma porta que o nginx nunca escuta,
# causando crashloop. CONCLUSAO REAL: com hostNetwork, dolphin e azahar
# NAO PODEM rodar ao mesmo tempo no mesmo node - as portas 3000/3001 do
# Selkies sempre colidem, sem solucao via config. So um dos dois por vez
# (ver replicaCount: 0 no values do dolphin).
sunshine:
  enabled: true
  hostNetwork: true
  privileged: true
  # -- Porta base deslocada +100 em relacao ao default do Sunshine (47989):
  # com hostNetwork, dolphin e azahar disputam o MESMO IP (o unico node
  # com GPU, moltres) - nas portas default colidem e um dos dois fica
  # Pending pra sempre (confirmado: "didn't have free ports for the
  # requested pod ports"). Todas as outras portas do Sunshine sao offsets
  # fixos a partir desta (ver comentario no values.yaml do chart).
  port: 48089

# -- Precisa ficar false enquanto dolphin (que tambem usa sunshine.hostNetwork)
# roda simultaneo no mesmo node: o nginx do Selkies escuta em 3000/3001
# hardcoded (nao configuravel), entao o segundo pod nunca consegue bindar
# essa porta - sem desligar a probe, o kubelet mata o container em
# crashloop mesmo com o Sunshine funcionando normalmente. Tradeoff: a UI
# web (KasmVNC) do azahar fica inacessivel enquanto os dois rodam juntos -
# o Moonlight nao e afetado. Reverter pra true se voltar a rodar sozinho.
probes:
  enabled: false

# -- Fixa no worker com a RTX 3050 (unico node com GPU no cluster).
nodeSelector:
  nvidia.com/gpu.present: "true"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: azahar-stream.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ROMs compartilhados com o romm, mesma PVC usada pelos outros emuladores.
extraVolumes:
  - name: roms
    persistentVolumeClaim:
      claimName: romm-library-truenas
extraVolumeMounts:
  - name: roms
    mountPath: /romm/library
  # -- Path nativo que o proprio emulador escaneia como biblioteca de
  # jogos (ver exemplo comentado no values.yaml default do chart). subPath
  # so da pasta "3ds" (slug da plataforma no romm) pra aparecer
  # como lista plana.
  - name: roms
    mountPath: /roms
    subPath: roms/3ds

persistence:
  config:
    enabled: true
    type: pvc
    storageClass: nfs-slowbro
    size: 10Gi

resources:
  # -- Requests subidos de 100m/256Mi para 300m/384Mi (2026-08-20): 3DS e
  # um sistema leve, limits ficam como estao - so uma reserva minima
  # melhor de CPU/RAM garantidos, node (moltres) tem folga de sobra.
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: "2"
    memory: 4Gi
