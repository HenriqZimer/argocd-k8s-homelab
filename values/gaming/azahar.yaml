# Azahar (3DS) emulator - web KasmVNC desktop, no secrets/database needed
# so this app doesn't use the Vault pattern like romm.
#
# Sem streaming: nao existe Docker Mod de integracao com o RomM publicado
# pra esse chart ainda (ver comentario do values.yaml default do chart) -
# streaming.enabled fica false, sem STREAMING_BROKER_SECRET/DOCKER_MODS.
#
# persistence.config habilitada (PVC via nfs-slowbro) pra saves/config
# sobreviverem a um restart do pod.
#
# Ingress: exposto via Traefik sob henriqzimer.com.br, so LAN (requer DNS
# local - Pi-hole em 192.168.1.106 - apontando azahar-stream para
# 192.168.1.160, o LoadBalancer do Traefik nesse cluster).
#
# Sunshine/Moonlight (2026-08-20, POC; migrado de hostNetwork pra
# LoadBalancer em 2026-08-23): sunshine.enabled roda o Sunshine ao lado do
# Selkies. Detalhes: github.com/henriqzimer/azahar-sunshine-mod
# - PIXELFLUX_WAYLAND=false: a imagem roda em Wayland por padrao; Sunshine
#   so consegue capturar via Xorg (X11), nao Wayland.
# - privileged (no bloco sunshine: abaixo): o pod precisa disso pro
#   Sunshine's uinput hotplug chegar ate o udev do container (mouse/
#   teclado/gamepad virtuais) - Kubernetes nao tem um knob mais fino pra
#   device-cgroup-rule fora de privileged: true.
# - Acesso: sunshine.service cria um Service LoadBalancer (MetalLB)
#   dedicado, compartilhando um unico IP externo com os outros emuladores
#   via metallb.io/allow-shared-ip (cada um com sua propria faixa de
#   portas, ver sunshine.port abaixo) - NAO usa mais hostNetwork nem a
#   rede do node diretamente.

# Forca rollout restart (2026-08-23): pega o fix do system_tray = disabled
# nos *-sunshine-mod (ghcr.io/henriqzimer) - sem isso o Sunshine destes
# pods provavelmente estava em crash loop (SIGABRT via AT_SECURE) desde que
# sunshine.enabled+privileged foram ligados, ja que so o cemu-sunshine-mod
# tinha esse workaround. DOCKER_MODS reinstala do zero a cada boot do pod
# (filesystem efemero), entao um restart sozinho ja basta pra pegar o fix -
# nao precisa rebuildar/republicar imagem nenhuma daqui.
podAnnotations:
  kubectl.kubernetes.io/restartedAt: "2026-08-23T18:09:27Z"

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Sao_Paulo"
  TITLE: "Azahar"
  # -- Expoe a GPU NVIDIA do node pro container. O runtime "nvidia" ja e o
  # default do containerd em talos-worker-3 (ver locals.tf do
  # terraform-homelab), entao nao precisa de RuntimeClass nem do resource
  # extendido nvidia.com/gpu (que exigiria 1 GPU inteira por pod - com
  # varios emuladores + romm no mesmo node, so um deles conseguiria agendar).
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "all"
  # -- Docker Mod do Sunshine (POC).
  DOCKER_MODS: "ghcr.io/henriqzimer/azahar-sunshine-mod:latest"
  # -- Legado da epoca de hostNetwork (sockets X11 abstratos colidiam entre
  # pods que compartilhavam a rede do node). Sem hostNetwork cada pod tem
  # sua propria network namespace, entao isso nao e mais estritamente
  # necessario - mantido mesmo assim, sem custo, como defesa extra.
  DISPLAY: ":2"
  # -- Obrigatorio pro Sunshine (ver comentario no topo do arquivo).
  PIXELFLUX_WAYLAND: "false"
  # -- Sem isso, a Web UI do Sunshine bloqueia por CSRF ao acessar por
  # IP em vez de localhost (confirmado: "The request was blocked by CSRF
  # protection"). O host normal (IP do node) e o Tailscale (acesso remoto).
  SUNSHINE_CSRF_ALLOWED_ORIGINS: "https://192.168.1.151:48090"

# NAO desloque service.httpPort/httpsPort: o nginx do Selkies dentro da
# imagem esta hardcoded pra escutar em 3000/3001, ignorando esse valor -
# so muda o Service/containerPort/probes do k8s, nunca o processo real.
# HISTORICO (resolvido 2026-08-23): com hostNetwork, dolphin e azahar
# disputavam o MESMO IP (unico node com GPU) e o nginx colidia direto -
# so um dos dois conseguia bindar 3000/3001, forcando replicaCount: 0 no
# dolphin. Migrar pra sunshine.service (LoadBalancer dedicado por pod, sem
# hostNetwork) resolveu isso na raiz: cada pod tem sua propria network
# namespace agora, entao o nginx nunca mais colide entre emuladores -
# dolphin e azahar (e todos os outros) podem rodar simultaneos.
sunshine:
  enabled: true
  privileged: true
  # -- Porta base unica por emulador - alem de evitar colisao no Sunshine
  # em si, tambem precisa ser unica porque varios emuladores agora
  # compartilham o MESMO IP externo (sunshine.service.loadBalancerIP),
  # entao so as portas os diferenciam. Todas as outras portas do Sunshine
  # sao offsets fixos a partir desta (ver comentario no values.yaml do
  # chart).
  port: 48089
  service:
    enabled: true
    loadBalancerIP: "192.168.1.151"
    sharedIPKey: "gaming-sunshine"

# -- Fixa no worker com a RTX 3050 (unico node com GPU no cluster).
nodeSelector:
  nvidia.com/gpu.present: "true"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: azahar-stream.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ROMs compartilhados com o romm, mesma PVC usada pelos outros emuladores.
extraVolumes:
  - name: roms
    persistentVolumeClaim:
      claimName: romm-library-truenas
extraVolumeMounts:
  - name: roms
    mountPath: /romm/library
  # -- Path nativo que o proprio emulador escaneia como biblioteca de
  # jogos (ver exemplo comentado no values.yaml default do chart). subPath
  # so da pasta "3ds" (slug da plataforma no romm) pra aparecer
  # como lista plana.
  - name: roms
    mountPath: /roms
    subPath: roms/3ds

persistence:
  config:
    enabled: true
    type: pvc
    storageClass: nfs-slowbro
    size: 10Gi

resources:
  # -- Requests subidos de 100m/256Mi para 300m/384Mi (2026-08-20): 3DS e
  # um sistema leve, limits ficam como estao - so uma reserva minima
  # melhor de CPU/RAM garantidos, node (moltres) tem folga de sobra.
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 4Gi
