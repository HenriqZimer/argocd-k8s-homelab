# Eden (Nintendo Switch emulator) - web KasmVNC desktop, sem database
# proprio (nao usa um Secret "-credentials" dedicado como o romm).
#
# persistence.config habilitada (PVC via nfs-slowbro) - sem isso,
# config/saves (e as keys do Switch em /config/.local/share/eden/keys,
# ver extraVolumeMounts abaixo) nao sobreviveriam a um restart do pod.
#
# Streaming (RomM Emulator Streaming - docs.romm.app/latest/using/emulator-streaming/):
# roda o broker via Docker Mod (eden-romm-integration) dentro do container
# do KasmVNC. BROKER_SECRET vem do mesmo Secret "streaming-broker-secret"
# usado pelo romm (STREAMING_BROKER_SECRET), sincronizado do Vault pelo
# VaultStaticSecret em charts/romm-extras (compartilhado entre romm e os
# emuladores com streaming habilitado). Eden nao suporta save states via
# streaming (so saves NAND normais).
#
# Ingress: exposto via Traefik (192.168.1.150) sob henriqzimer.com.br, pega
# o certificado wildcard automatico do Traefik (nao precisa de tls: aqui).
# DE PROPOSITO nao entra no terraform-cloudflare/tunel (so LAN) - streaming
# em tempo real nao deveria dar a volta pela rede da Cloudflare a cada
# frame. Requer DNS local: aponte eden-stream.henriqzimer.com.br para
# 192.168.1.150 (via /etc/hosts no seu dispositivo ou um registro local no
# Pi-hole - 192.168.1.106).

# Forca rollout restart (2026-08-23): pega o fix do system_tray = disabled
# nos *-sunshine-mod (ghcr.io/henriqzimer) - sem isso o Sunshine destes
# pods provavelmente estava em crash loop (SIGABRT via AT_SECURE) desde que
# sunshine.enabled+privileged foram ligados, ja que so o cemu-sunshine-mod
# tinha esse workaround. DOCKER_MODS reinstala do zero a cada boot do pod
# (filesystem efemero), entao um restart sozinho ja basta pra pegar o fix -
# nao precisa rebuildar/republicar imagem nenhuma daqui.
podAnnotations:
  kubectl.kubernetes.io/restartedAt: "2026-08-23T18:09:27Z"

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Sao_Paulo"
  TITLE: "Eden"
  # -- Docker Mods: broker de streaming do RomM + Sunshine/Moonlight.
  # A imagem do Eden tinha o modo X11 quebrado upstream (startwm.sh/
  # autostart hardcoded/corrompido, so mostrava um popup falso "platform
  # not supported" sem checagem real - AVX2 esta presente, confirmado via
  # /proc/cpuinfo) - corrigido no mod (root/defaults/), mesmo padrao do
  # ppsspp/shadps4-sunshine-mod. Wrapper LD_PRELOAD tambem presente (mesmo
  # fix de gamepad dos outros 8 emuladores). Idle-freeze (SIGSTOP) NAO
  # esta habilitado pro Eden: confirmado que quebra a supervisao ptrace do
  # sudo usado pra lancar o Eden via broker (processo vira zumbi ao
  # receber SIGCONT) - ver commit do eden-sunshine-mod.
  # DOCKER_MODS: "ghcr.io/loneangelfayt/eden-romm-integration-mod:latest|ghcr.io/henriqzimer/eden-sunshine-mod:latest"
  DOCKER_MODS: "ghcr.io/henriqzimer/eden-sunshine-mod:latest"
  # -- Precisa ser o mesmo path onde o romm monta a library (romm.persistence.library -> /romm/library).
  ROM_ROOT: "/romm/library"
  # -- Obrigatorio pro Sunshine (a imagem roda em Wayland por padrao, Sunshine so captura via Xorg/X11).
  PIXELFLUX_WAYLAND: "false"
  # -- Sem isso, a Web UI do Sunshine bloqueia por CSRF ao acessar por IP
  # em vez de localhost. Aponta pro IP compartilhado do Service LoadBalancer
  # (sunshine.service abaixo), nao pro IP do node - sem hostNetwork, o
  # auto-detect do mod (ip route get) resolveria o IP interno do pod, que
  # o navegador nunca usa.
  SUNSHINE_CSRF_ALLOWED_ORIGINS: "https://192.168.1.151:48590"
  # -- Sockets Unix abstratos do X11 sao compartilhados pelo NETWORK
  # NAMESPACE, nao pelo mount namespace do container - varios pods
  # sunshine.hostNetwork simultaneos no mesmo node precisam de DISPLAY
  # unico (dolphin=1, azahar=2, pcsx2=3, rpcs3=4, xemu=5, flycast=6,
  # eden=7).
  DISPLAY: ":7"
  # -- streaming.brokerPort (abaixo) so muda o containerPort declarado no
  # Deployment - o broker le a porta de BROKER_PORT (default 8000,
  # hardcoded), entao sem isso colidiria com o dolphin.
  BROKER_PORT: "8003"
  # -- Expoe a GPU NVIDIA do node pro container. O runtime "nvidia" ja e o
  # default do containerd em talos-worker-3 (ver locals.tf do
  # terraform-homelab), entao nao precisa de RuntimeClass nem do resource
  # extendido nvidia.com/gpu (que exigiria 1 GPU inteira por pod - com 4
  # emuladores + romm no mesmo node, so um deles conseguiria agendar).
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "all"
  # -- Reduz input lag (2026-08-18): o Selkies (streaming da KasmVNC) usa
  # por padrao um pipeline pensado pra desktop parado (deteccao de "damage"
  # + paint-over, so re-encoda a regiao que mudou, com um burst de
  # qualidade quando a tela para de mudar). Pra jogo em fullscreen, tela
  # inteira muda a cada frame o tempo todo - esse pipeline so acrescenta
  # overhead. H264_STREAMING_MODE bypassa essa logica e encoda frame
  # cheio direto (confirmado no codigo do linuxserver/pixelflux: "Bypass
  # all VNC logic and work like a normal video encoder, higher constant
  # CPU usage for fullscreen gaming/videos"). CBR fixo (em vez de CRF
  # variavel) evita picos de tamanho de frame em cenas com muito
  # movimento, que geram spikes de latencia; 30Mbps e generoso pra LAN
  # gigabit com encode via NVENC (RTX 3050), sem gargalo de CPU.
  SELKIES_H264_STREAMING_MODE: "true"
  SELKIES_ENABLE_RATE_CONTROL: "true"
  SELKIES_RATE_CONTROL_MODE: "cbr"
  SELKIES_VIDEO_BITRATE: "30"
  SELKIES_FRAMERATE: "60"

envFrom:
  - secretRef:
      name: streaming-broker-secret

# -- Fixa no worker com a RTX 3050 (unico node com GPU no cluster).
nodeSelector:
  nvidia.com/gpu.present: "true"

# -- Subido de 2Gi (default do chart) pra 4Gi (2026-08-18): shm memory-backed,
# usado pelo mmap "fastmem" do JIT (mesma razao do SIGBUS documentado no
# pcsx2) e como buffer de captura de tela do Selkies em full-frame streaming
# mode - com textura em alta res do Switch, 2Gi fica no limite. Cabe dentro
# do limite de memoria do pod (8Gi) com folga.
shmSize: 4Gi

streaming:
  enabled: true
  # -- brokerPort default (8000) colide com o dolphin, que tambem tem
  # streaming.enabled com hostNetwork (via sunshine) no mesmo node.
  brokerPort: 8003

sunshine:
  enabled: true
  privileged: true
  # -- Porta unica por emulador (todas as outras portas do Sunshine sao
  # offsets fixos a partir desta - ver comentario no values.yaml do chart).
  port: 48589
  service:
    enabled: true
    loadBalancerIP: "192.168.1.151"
    sharedIPKey: "gaming-sunshine"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: eden-stream.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ROMs compartilhados com o romm, montados no mesmo path que o romm
# usa (/romm/library) para o broker conseguir resolver os mesmos arquivos.
extraVolumes:
  - name: roms
    persistentVolumeClaim:
      claimName: romm-library-truenas
extraVolumeMounts:
  - name: roms
    mountPath: /romm/library
  # -- Keys/firmware do Switch (prod.keys, title.keys) ja vivem em
  # /romm/library/bios/switch (mesma PVC, subPath so daquela pasta) -
  # monta por cima de /config/.local/share/eden/keys, que e o path fixo
  # (nao configuravel via ini) que o Eden usa pra achar as keys, mesmo
  # padrao do bios/ps2 -> /config/bios do pcsx2. Confirmado via `kubectl
  # exec` no pod rodando (find /config/.local/share/eden mostra
  # keys/, nand/system/Contents/registered/ etc - estrutura herdada do
  # yuzu). Firmware (NCAs) ainda precisa ser instalado pela UI do Eden
  # (File > Install Files to NAND) - o romm so guarda os arquivos, nao
  # ha um path fixo de firmware bruto pra montar direto.
  - name: roms
    mountPath: /config/.local/share/eden/keys
    subPath: bios/switch
  # -- Path nativo que o proprio Eden escaneia como biblioteca de jogos
  # (ver exemplo comentado no values.yaml default do chart). subPath so
  # da pasta "switch" (slug da plataforma no romm) pra aparecer como
  # lista plana, sem misturar com os outros sistemas.
  - name: roms
    mountPath: /roms
    subPath: roms/switch

persistence:
  config:
    enabled: true
    type: pvc
    storageClass: nfs-slowbro
    size: 10Gi

resources:
  # -- Requests subidos de 100m/256Mi para 500m/512Mi (2026-08-18): reserva
  # um pouco mais de CPU/RAM garantidos (cgroup shares) pra nao sofrer
  # throttling quando outro pod no mesmo node (moltres) tambem estiver sob
  # carga. O node tem folga de sobra - ver `kubectl top node moltres`.
  # -- CPU reduzido de 500m para 250m (2026-08-23): pos-throttling incident
  # no moltres, request agregado dos 9 emuladores estava alto demais -
  # 250m ja garante cgroup shares suficientes, o limit de 6 CPU (medido,
  # ver abaixo) continua intacto pra permitir burst real durante gameplay.
  requests:
    cpu: 250m
    memory: 512Mi
  # -- Limite subido de 2 CPU/4Gi para 3 CPU/8Gi (2026-08-18): pod estava
  # sendo OOMKilled (exit 137) ao carregar um jogo (Switch emula shader
  # compilation + texturas em alta res, uso de RAM bem maior que os
  # outros emuladores 2D/PS1-era deste values/gaming/). CPU subido de novo
  # pra 4 (2026-08-18) - JIT do Eden e single-thread-heavy, folga de sobra
  # no node pra isso.
  #
  # Subido de novo pra 6 CPU/12Gi (2026-08-22): confirmado ao vivo que o
  # pod ficava colado no teto de 4 CPU (3.5-3.9 de uso real) durante
  # gameplay ativo, exatamente o padrao de cgroup throttling que causa
  # stutter/fps inconsistente - o node tem 8 CPU no total e so tinha ~1.4-
  # 1.8 CPU alocado pro resto quando isso foi medido, entao havia folga
  # real pra dar mais. RAM tambem chegando perto do teto (~7.3-7.4Gi de
  # 8Gi) - subido junto por seguranca (node tem 32Gi, folga de sobra).
  limits:
    cpu: "6"
    memory: 12Gi
