# RPCS3 (PS3) emulator - web KasmVNC desktop, no secrets/database needed
# so this app doesn't use the Vault pattern like romm.
#
# Sem streaming: nao existe Docker Mod de integracao com o RomM publicado
# pra esse chart ainda (ver comentario do values.yaml default do chart) -
# streaming.enabled fica false, sem STREAMING_BROKER_SECRET/DOCKER_MODS.
#
# persistence.config habilitada (PVC via nfs-slowbro) pra saves/config
# sobreviverem a um restart do pod.
#
# Ingress: exposto via Traefik sob henriqzimer.com.br, so LAN (requer DNS
# local - Pi-hole em 192.168.1.106 - apontando rpcs3-stream para
# 192.168.1.160, o LoadBalancer do Traefik nesse cluster).

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Sao_Paulo"
  TITLE: "RPCS3"
  # -- Expoe a GPU NVIDIA do node pro container. O runtime "nvidia" ja e o
  # default do containerd em talos-worker-3 (ver locals.tf do
  # terraform-homelab), entao nao precisa de RuntimeClass nem do resource
  # extendido nvidia.com/gpu (que exigiria 1 GPU inteira por pod - com
  # varios emuladores + romm no mesmo node, so um deles conseguiria agendar).
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "all"
  # -- Docker Mod do Sunshine (POC).
  DOCKER_MODS: "ghcr.io/henriqzimer/rpcs3-sunshine-mod:latest"
  # -- Obrigatorio pro Sunshine (a imagem roda em Wayland por padrao, Sunshine so captura via Xorg/X11).
  PIXELFLUX_WAYLAND: "false"
  # -- Sem isso, a Web UI do Sunshine bloqueia por CSRF ao acessar por
  # IP em vez de localhost (confirmado: "The request was blocked by CSRF
  # protection"). O host normal (IP do node) e o Tailscale (acesso remoto).
  SUNSHINE_CSRF_ALLOWED_ORIGINS: "https://192.168.1.122:48290,https://100.98.39.59:48290"
  # -- Sockets Unix abstratos do X11 sao compartilhados pelo NETWORK
  # NAMESPACE, nao pelo mount namespace do container - com varios pods
  # sunshine.hostNetwork simultaneos no mesmo node, todos tentando :1
  # (default da imagem) colidem ("server already running"). Cada
  # emulador com sunshine.enabled precisa de um DISPLAY unico (dolphin=1,
  # azahar=2, pcsx2=3, rpcs3=4, xemu=5, flycast=6).
  DISPLAY: ":4"

sunshine:
  enabled: true
  hostNetwork: true
  privileged: true
  # -- Porta unica por emulador (todas as outras portas do Sunshine sao
  # offsets fixos a partir desta - ver comentario no values.yaml do chart).
  port: 48289

# -- Precisa ficar false enquanto outros emuladores com sunshine.hostNetwork
# rodam simultaneos no mesmo node (nginx do Selkies hardcoded em 3000/3001,
# colide entre pods) - ver comentario equivalente no azahar.yaml.
probes:
  enabled: false

# -- Fixa no worker com a RTX 3050 (unico node com GPU no cluster).
nodeSelector:
  nvidia.com/gpu.present: "true"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: rpcs3-stream.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ROMs compartilhados com o romm, mesma PVC usada pelos outros emuladores.
extraVolumes:
  - name: roms
    persistentVolumeClaim:
      claimName: romm-library-truenas
extraVolumeMounts:
  - name: roms
    mountPath: /romm/library
  # -- Path nativo que o proprio emulador escaneia como biblioteca de
  # jogos (ver exemplo comentado no values.yaml default do chart). subPath
  # so da pasta "ps3" (slug da plataforma no romm) pra aparecer
  # como lista plana.
  - name: roms
    mountPath: /roms
    subPath: roms/ps3

persistence:
  config:
    enabled: true
    type: pvc
    storageClass: nfs-slowbro
    size: 10Gi

resources:
  # -- Requests subidos de 100m/256Mi para 500m/1Gi e limits de 2 CPU/4Gi
  # para 4 CPU/8Gi (2026-08-20): RPCS3 (PS3) e o emulador mais pesado desse
  # values/gaming/ - shader recompilation (PPU/SPU) e bem mais exigente de
  # CPU/RAM que os sistemas 2D/PS1-era, e o teto antigo era o mesmo usado
  # pro PSP/Dreamcast/3DS. Node (moltres) tem folga de sobra pra isso -
  # mesmo padrao ja aplicado nos 4 emuladores com streaming (ver commit
  # a39112c).
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 8Gi
