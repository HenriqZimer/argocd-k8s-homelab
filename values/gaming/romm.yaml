# RomM - configurado para usar o Vault (secrets.enabled: false) em vez dos
# secrets internos do chart. Os valores sensiveis (senhas, API keys) vem do
# Secret "romm-credentials" (sincronizado do Vault via gaming/romm/manifests/
# vault-secret.yaml); os nao-sensiveis (nomes de usuario/banco, porta) ficam
# direto aqui, mesmo padrao usado nos outros apps deste repo.

# -- Number of RomM replicas to start. Should be left at 1.
replicaCount: 1

# -- Number of old ReplicaSets to retain for rollback history.
revisionHistoryLimit: 3

# -- Image pull secrets to authenticate with private repositories.
imagePullSecrets: []

# -- Override the default name of the chart.
nameOverride: ""
# -- Override the default full name of the chart.
fullnameOverride: ""

# -- Annotations to add to the pod.
podAnnotations: {}
# -- Additional labels to add to the pod.
podLabels: {}

# -- Security context for the pod.
podSecurityContext: {}

# -- Security context for the container. O chart tem "drop: [ALL]" como
# default e um override vazio ({}) nao limpa isso (merge de mapa do Helm nao
# apaga chaves existentes) - por isso precisamos re-adicionar explicitamente
# as capabilities que o entrypoint da imagem realmente usa, todas para o
# processo master rodando como root (uid 0) dentro do container:
#   - CHOWN: nginx ajusta dono do /tmp/client_body pro uid do worker (romm/1000)
#   - SETUID/SETGID: nginx e o supervisor derrubam privilegio pros workers
#   - DAC_OVERRIDE: o valkey interno roda como root mas /redis-data pertence
#     ao uid 1000 (modo 755, sem write pra outros) - sem essa capability o
#     bgsave falha com "MISCONF ... unable to persist to disk" e o Redis passa
#     a recusar escritas, quebrando sessao/heartbeat (erros 500 na API)
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE

# -- Node selector for pod scheduling.
nodeSelector: {}

# -- Tolerations for pod scheduling.
tolerations: []

# -- Affinity rules for pod scheduling.
affinity: {}

# -- Secrets em modo externo: os valores sensiveis vem do Secret
# "romm-credentials" (sincronizado do Vault) via romm.envFrom/mariadb.envFrom
# abaixo, nao dos secrets internos do chart.
secrets:
  enabled: false

# -- RomM application configuration
romm:
  # -- Container image configuration
  image:
    # -- Container image repository for RomM.
    repository: docker.io/rommapp/romm
    # -- RomM container image tag. O banco externo ja tem migrations ate
    # 0069_sibling_roms_fs_name (de uma instalacao anterior), que so existe a
    # partir da 4.9.2 - versoes mais antigas (ex: 4.5.0) nao reconhecem essa
    # revisao e falham ao migrar. Fixado na ultima estavel (nao alpha/beta).
    # Atualizado para 5.2.0 em 2026-08-20 (chart bumpado de 1.3.0 para 1.5.5
    # junto - ver targetRevision em apps/07-gaming/romm.yaml).
    # Atualizado para 5.4.0 em 2026-10-19 (chart 1.6.0). O primeiro boot roda
    # migrations longas (15-20 min em biblioteca grande) - nao reiniciar o pod
    # enquanto isso.
    tag: "5.4.0"
    # -- Image pull policy (Always, IfNotPresent, or Never).
    pullPolicy: IfNotPresent

  # -- Resources requests and limits for RomM container.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  # -- Service configuration
  service:
    # -- Service type (ClusterIP, NodePort, or LoadBalancer).
    type: ClusterIP
    # -- Port for the RomM service.
    port: 8080
    # -- Name of the port in the service.
    portName: http
    # -- Annotations for the service.
    annotations: {}
    # -- Labels for the service.
    labels: {}

  # -- Ingress configuration.
  ingress:
    enabled: true
    className: "traefik"
    annotations: {}
    hosts:
      - host: romm.henriqzimer.com.br
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # -- Persistence configuration for RomM data
  persistence:
    # -- Configuration data (database connection, API keys, etc)
    config:
      enabled: true
      type: pvc
      hostPath: ""
      accessMode: ReadWriteOnce
      size: 1Gi
      annotations: {}
      storageClass: "nfs-slowbro"
      existingClaim: ""

    library:
      enabled: true
      type: pvc
      hostPath: ""
      accessMode: ReadWriteMany
      size: 100Gi
      annotations: {}
      storageClass: "nfs-slowbro"
      existingClaim: "romm-library-truenas"

    # -- Resources (cover images, screenshots, etc)
    resources:
      enabled: true
      type: pvc
      hostPath: ""
      accessMode: ReadWriteOnce
      size: 10Gi
      annotations: {}
      storageClass: "nfs-slowbro"
      existingClaim: ""

    # -- Assets (EmulatorJS files, etc)
    assets:
      enabled: true
      type: pvc
      hostPath: ""
      accessMode: ReadWriteOnce
      size: 5Gi
      annotations: {}
      storageClass: "nfs-slowbro"
      existingClaim: ""

  # -- Valores nao-sensiveis (senhas/keys ficam no Secret romm-credentials via envFrom)
  env:
    - name: DB_PORT
      value: "3306"
    - name: DB_USER
      value: "romm"
    - name: DB_NAME
      value: "romm"

  # -- Carrega DB_PASSWD, ROMM_AUTH_SECRET_KEY e as API keys de metadata do
  # Secret romm-credentials, e STREAMING_BROKER_SECRET do Secret
  # streaming-broker-secret (compartilhado com pcsx2/dolphin/eden/xemu) -
  # ambos sincronizados do Vault pelos VaultStaticSecret em charts/romm-extras.
  envFrom:
    - secretRef:
        name: romm-credentials
    - secretRef:
        name: streaming-broker-secret

  # -- RomM Configuration File (config.yml). `host` precisa ser alcancavel
  # pelo NAVEGADOR do usuario - usa os hostnames Ingress via Traefik
  # (certificado wildcard real *.henriqzimer.com.br, LAN-only, fora do
  # tunel Cloudflare para nao adicionar latencia ao stream). Requer DNS
  # local (client /etc/hosts ou Pi-hole) apontando esses hosts para
  # 192.168.1.150. `broker_host` e chamado pelo backend do romm
  # (server-to-server), autenticado com o mesmo STREAMING_BROKER_SECRET do
  # Secret streaming-broker-secret.
  #
  # Streaming via protocol "webstation" (testado em 2026-10-19): um unico
  # container (app `webstation`) atende todas as plataformas, no lugar dos
  # pods por emulador com Docker Mods (deprecados upstream). Os mods antigos
  # so cobriam PCSX2/Dolphin/xemu/Eden; o webstation cobre tambem RPCS3,
  # Azahar, PPSSPP, Flycast e shadPS4. O formato antigo ficou como rollback
  # no comentario do bloco `streaming` abaixo.
  #
  # `host` e um path (/streaming) na mesma origem do RomM; ver o comentario
  # no bloco `streaming` abaixo.
  config:
    enabled: true
    name: romm-config-file
    data: |
      # OBRIGATORIO desde RomM 5.3: declarar o layout da biblioteca, senao o
      # romm recusa iniciar. Layout atual: /romm/library/roms/<plataforma>/<jogo>
      # e /romm/library/bios/<plataforma> (ver mounts dos emuladores).
      filesystem:
        structure:
          default: "roms/{platform}/{game}"
          firmware: "bios/{platform}"
      streaming:
        enabled: true
        containers:
          # Teste do protocolo webstation (2026-10-19): UM container atende todas
          # as plataformas (app `webstation`, values/gaming/webstation.yaml).
          # `host` e acessado pelo NAVEGADOR (HTTPS, Ingress Traefik, LAN-only);
          # `broker_host` e server-to-server (Service interno, porta HTTP 3000,
          # servido sob o mesmo subfolder). Autenticado com o
          # STREAMING_BROKER_SECRET (igual ao BROKER_SECRET do webstation).
          # library_path = onde o container ve a biblioteca (nao mudar: o
          # historico de saves/states e indexado por ele).
          #
          # ROLLBACK (formato antigo, um pod por emulador com broker mod):
          #   - platform: ps2     host: https://pcsx2-stream.henriqzimer.com.br    broker_host: http://pcsx2.gaming.svc.cluster.local:8001   label: PCSX2
          #   - platform: ngc     host: https://dolphin-stream.henriqzimer.com.br  broker_host: http://dolphin.gaming.svc.cluster.local:8000  label: Dolphin
          #   - platform: xbox    host: https://xemu-stream.henriqzimer.com.br     broker_host: http://xemu.gaming.svc.cluster.local:8002    label: xemu
          #   - platform: switch  host: https://eden-stream.henriqzimer.com.br     broker_host: http://eden.gaming.svc.cluster.local:8003    label: Eden
          # (cada um como item da lista, com os campos em linhas separadas)
          - protocol: webstation
            # Mesma origem do RomM: o webstation e servido em
            # romm.henriqzimer.com.br/streaming (ingress em
            # values/gaming/webstation.yaml). `host` e um path, entao
            # `broker_host` e obrigatorio. Aponta pro hostname publico do RomM
            # (via Traefik, alcancavel de dentro do cluster) e NAO pro Service
            # interno: o broker deduz o endereco de callback do upload de saves
            # a partir do request que recebe, e pelo Service interno ele
            # tentava devolver o save pra si mesmo ("All connection attempts
            # failed"). subfolder precisa bater com SUBFOLDER do webstation.
            host: /streaming
            subfolder: /streaming
            broker_host: https://romm.henriqzimer.com.br
            library_path: /romm/library
            label: Emulation station
            platforms:
              ps2:
                emulator: pcsx2
                label: PCSX2
              ngc:
                emulator: dolphin
                label: Dolphin
              wii:
                emulator: dolphin
                label: Dolphin
              xbox:
                emulator: xemu
                label: xemu
              switch:
                emulator: eden
                label: Eden
              ps3:
                emulator: rpcs3
                label: RPCS3
              3ds:
                emulator: azahar
                label: Azahar
              psp:
                emulator: ppsspp
                label: PPSSPP
              dc:
                emulator: flycast
                label: Flycast
              ps4:
                emulator: shadps4
                label: shadPS4

mariadb:
  enabled: false

  externalDatabase:
    host: "192.168.1.105"

# -- Nao configurado explicitamente: o chart (desde 1.4.0) passou a exigir
# Redis/Valkey (tarefas agendadas, watcher, sessao) e nao vinha com nada -
# com redis.enabled default (true) o proprio chart sobe um Deployment/PVC
# "romm-redis" interno (sem auth, pois secrets.enabled: false aqui desativa
# o requirepass) usando a storageClass default do cluster (nfs-slowbro).
# Se preferir apontar pra um Redis externo em vez disso, usar
# redis.enabled: false + redis.externalRedis.host/port.
