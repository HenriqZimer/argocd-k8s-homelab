# Dolphin (GameCube/Wii emulator) - web KasmVNC desktop, sem database
# proprio (nao usa um Secret "-credentials" dedicado como o romm).
#
# replicaCount: 0 (2026-08-20, temporario): derrubado pra liberar CPU no
# moltres enquanto valida o azahar-sunshine-mod - com os dois emuladores
# rodando Xorg/Selkies/Sunshine/NVENC ao mesmo tempo (mais o
# argocd-application-controller reconciliando), o node bateu load average
# 30+ (8 CPUs) e o kubelet ficou instavel. Reverter pra 1 quando a POC do
# azahar estiver validada.
# persistence.config habilitada (PVC via nfs-slowbro) - sem isso,
# saves/config nao sobreviveriam a um restart do pod.
#
# Streaming (RomM Emulator Streaming - docs.romm.app/latest/using/emulator-streaming/):
# roda o broker via Docker Mod (dolphin-romm-integration) dentro do
# container do KasmVNC. BROKER_SECRET vem do mesmo Secret
# "streaming-broker-secret" usado pelo romm (STREAMING_BROKER_SECRET),
# sincronizado do Vault pelo VaultStaticSecret em charts/romm-extras
# (compartilhado entre romm e os emuladores com streaming habilitado).
#
# Ingress: exposto via Traefik (192.168.1.150) sob henriqzimer.com.br, pega
# o certificado wildcard automatico do Traefik (nao precisa de tls: aqui).
# DE PROPOSITO nao entra no terraform-cloudflare/tunel (so LAN) - streaming
# em tempo real nao deveria dar a volta pela rede da Cloudflare a cada
# frame. Requer DNS local: aponte dolphin-stream.henriqzimer.com.br para
# 192.168.1.150 (via /etc/hosts no seu dispositivo ou um registro local no
# Pi-hole - 192.168.1.106).
#
# Sunshine/Moonlight (2026-08-20, POC): sunshine.enabled roda o Sunshine ao
# lado do Selkies, pra testar se Moonlight tira o input lag que sobra
# mesmo com o tuning do Selkies acima. Detalhes completos (por que precisa
# de cada coisa) no README do mod: github.com/henriqzimer/dolphin-sunshine-mod
# - PIXELFLUX_WAYLAND=false: a imagem roda em Wayland por padrao: Sunshine
#   so consegue capturar via Xvfb/Xorg (X11), nao Wayland.
# - hostNetwork/privileged (no bloco sunshine: abaixo): Moonlight fala
#   TCP+UDP cru (nao passa pelo Traefik) e o pod precisa da network
#   namespace do host pros eventos de hotplug do uinput chegarem no udev
#   dentro do container - sem isso, os dispositivos virtuais de
#   mouse/teclado/gamepad que o Sunshine cria ficam invisiveis pro X.
# - Acesso: parear o app Moonlight direto pelo IP do node moltres (o pod
#   fica na rede do host) - nao tem Service/Ingress pra essas portas.

replicaCount: 1

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Sao_Paulo"
  TITLE: "Dolphin"
  # -- Docker Mods (aplicados em ordem, separados por "|"): o broker de
  # streaming do RomM + o mod do Sunshine (POC).
  DOCKER_MODS: "ghcr.io/loneangelfayt/dolphin-romm-integration-mod:latest|ghcr.io/henriqzimer/dolphin-sunshine-mod:latest"
  # -- Obrigatorio pro Sunshine (ver comentario no topo do arquivo).
  PIXELFLUX_WAYLAND: "false"
  # -- Precisa ser o mesmo path onde o romm monta a library (romm.persistence.library -> /romm/library).
  ROM_ROOT: "/romm/library"
  # -- Expoe a GPU NVIDIA do node pro container. O runtime "nvidia" ja e o
  # default do containerd em talos-worker-3 (ver locals.tf do
  # terraform-homelab), entao nao precisa de RuntimeClass nem do resource
  # extendido nvidia.com/gpu (que exigiria 1 GPU inteira por pod - com 4
  # emuladores + romm no mesmo node, so um deles conseguiria agendar).
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "all"
  # -- Reduz input lag (2026-08-18): o Selkies (streaming da KasmVNC) usa
  # por padrao um pipeline pensado pra desktop parado (deteccao de "damage"
  # + paint-over, so re-encoda a regiao que mudou, com um burst de
  # qualidade quando a tela para de mudar). Pra jogo em fullscreen, tela
  # inteira muda a cada frame o tempo todo - esse pipeline so acrescenta
  # overhead. H264_STREAMING_MODE bypassa essa logica e encoda frame
  # cheio direto (confirmado no codigo do linuxserver/pixelflux: "Bypass
  # all VNC logic and work like a normal video encoder, higher constant
  # CPU usage for fullscreen gaming/videos"). CBR fixo (em vez de CRF
  # variavel) evita picos de tamanho de frame em cenas com muito
  # movimento, que geram spikes de latencia; 30Mbps e generoso pra LAN
  # gigabit com encode via NVENC (RTX 3050), sem gargalo de CPU.
  SELKIES_H264_STREAMING_MODE: "true"
  SELKIES_ENABLE_RATE_CONTROL: "true"
  SELKIES_RATE_CONTROL_MODE: "cbr"
  SELKIES_VIDEO_BITRATE: "30"
  SELKIES_FRAMERATE: "60"

envFrom:
  - secretRef:
      name: streaming-broker-secret

# -- Fixa no worker com a RTX 3050 (unico node com GPU no cluster).
nodeSelector:
  nvidia.com/gpu.present: "true"

# -- Subido de 2Gi (default do chart) pra 4Gi (2026-08-18): shm memory-backed,
# usado como buffer de captura de tela do Selkies em full-frame streaming
# mode e pelo ubershader cache do Dolphin. Cabe dentro do limite de
# memoria do pod (6Gi) com folga.
shmSize: 4Gi

streaming:
  enabled: true

sunshine:
  enabled: true
  hostNetwork: true
  privileged: true

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: dolphin-stream.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ROMs compartilhados com o romm, montados no mesmo path que o romm usa
# (/romm/library) para o broker conseguir resolver os mesmos arquivos.
extraVolumes:
  - name: roms
    persistentVolumeClaim:
      claimName: romm-library-truenas
extraVolumeMounts:
  - name: roms
    mountPath: /romm/library

persistence:
  config:
    enabled: true
    type: pvc
    storageClass: nfs-slowbro
    size: 10Gi

resources:
  # -- Requests subidos de 100m/256Mi para 500m/512Mi (2026-08-18): reserva
  # um pouco mais de CPU/RAM garantidos (cgroup shares) pra nao sofrer
  # throttling quando outro pod no mesmo node (moltres) tambem estiver sob
  # carga. O node tem folga de sobra - ver `kubectl top node moltres`.
  requests:
    cpu: 500m
    memory: 512Mi
  # -- Limite subido de 2 CPU/4Gi para 4 CPU/6Gi (2026-08-18): Dolphin com
  # ubershaders/compilacao de shader e streaming full-frame pode encostar
  # no teto antigo - node tem folga de sobra pra isso.
  limits:
    cpu: "4"
    memory: 6Gi
