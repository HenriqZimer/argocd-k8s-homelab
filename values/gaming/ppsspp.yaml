# PPSSPP (PSP) emulator - web KasmVNC desktop, no secrets/database needed
# so this app doesn't use the Vault pattern like romm.
#
# Sem streaming: nao existe Docker Mod de integracao com o RomM publicado
# pra esse chart ainda (ver comentario do values.yaml default do chart) -
# streaming.enabled fica false, sem STREAMING_BROKER_SECRET/DOCKER_MODS.
#
# persistence.config habilitada (PVC via nfs-slowbro) pra saves/config
# sobreviverem a um restart do pod.
#
# Ingress: exposto via Traefik sob henriqzimer.com.br, so LAN (requer DNS
# local - Pi-hole em 192.168.1.106 - apontando ppsspp-stream para
# 192.168.1.160, o LoadBalancer do Traefik nesse cluster).

# Forca rollout restart (2026-08-23): pega o fix do system_tray = disabled
# nos *-sunshine-mod (ghcr.io/henriqzimer) - sem isso o Sunshine destes
# pods provavelmente estava em crash loop (SIGABRT via AT_SECURE) desde que
# sunshine.enabled+privileged foram ligados, ja que so o cemu-sunshine-mod
# tinha esse workaround. DOCKER_MODS reinstala do zero a cada boot do pod
# (filesystem efemero), entao um restart sozinho ja basta pra pegar o fix -
# nao precisa rebuildar/republicar imagem nenhuma daqui.
podAnnotations:
  kubectl.kubernetes.io/restartedAt: "2026-08-23T18:09:27Z"

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Sao_Paulo"
  TITLE: "PPSSPP"
  # -- Expoe a GPU NVIDIA do node pro container. O runtime "nvidia" ja e o
  # default do containerd em talos-worker-3 (ver locals.tf do
  # terraform-homelab), entao nao precisa de RuntimeClass nem do resource
  # extendido nvidia.com/gpu (que exigiria 1 GPU inteira por pod - com
  # varios emuladores + romm no mesmo node, so um deles conseguiria agendar).
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "all"
  # -- Docker Mod do Sunshine. Alem do fix de gamepad/resolucao padrao,
  # esse mod tambem corrige o startwm.sh/autostart quebrados da imagem
  # upstream (sem isso o desktop nunca sobe - ver CHANGELOG do mod).
  DOCKER_MODS: "ghcr.io/henriqzimer/ppsspp-sunshine-mod:latest"
  # -- Obrigatorio pro Sunshine (a imagem roda em Wayland por padrao, Sunshine so captura via Xorg/X11).
  PIXELFLUX_WAYLAND: "false"
  # -- Sem isso, a Web UI do Sunshine bloqueia por CSRF ao acessar por IP
  # em vez de localhost. Aponta pro IP compartilhado do Service LoadBalancer
  # (sunshine.service abaixo), nao pro IP do node - sem hostNetwork, o
  # auto-detect do mod (ip route get) resolveria o IP interno do pod, que
  # o navegador nunca usa.
  SUNSHINE_CSRF_ALLOWED_ORIGINS: "https://192.168.1.151:48690"
  # -- Sockets Unix abstratos do X11 sao compartilhados pelo NETWORK
  # NAMESPACE, nao pelo mount namespace do container - varios pods
  # sunshine.hostNetwork simultaneos no mesmo node precisam de DISPLAY
  # unico (dolphin=1, azahar=2, pcsx2=3, rpcs3=4, xemu=5, flycast=6,
  # eden=7, ppsspp=8).
  DISPLAY: ":8"

sunshine:
  enabled: true
  # REVERTIDO PRA true (2026-08-26): tentativa de tirar privileged (ver
  # historico do commit) CONFIRMOU dois problemas reais em sequencia:
  # 1) privileged:true por si so expoe o /dev/input inteiro do HOST pro
  #    container (confirmado via kubectl exec + ls, 31 event devices,
  #    incluindo gamepads virtuais de OUTROS emuladores no mesmo node) -
  #    causa raiz do controle/mouse vazar entre emuladores.
  # 2) Removendo privileged (so NET_ADMIN + os mounts hostPath CharDevice
  #    de /dev/uinput e /dev/uhid), o Sunshine passou a falhar com
  #    "Unable to create virtual mouse/keyboard: Operation not permitted"
  #    - confirmado no sunshine.log. O Kubernetes (diferente do Docker)
  #    nao propaga automaticamente a permissao de cgroup pro device
  #    quando e so um hostPath char-device sem privileged - resultado:
  #    SEM NENHUM input funcionando (pior que o vazamento).
  # Como (2) e mais grave que (1) pro uso real, revertido pra privileged:
  # true por enquanto ate confirmar uma capability minima que resolva o
  # uinput sem reabrir o /dev do host (SYS_ADMIN e candidato, ainda nao
  # testado em producao).
  privileged: true
  # -- Porta unica por emulador (todas as outras portas do Sunshine sao
  # offsets fixos a partir desta - ver comentario no values.yaml do chart).
  port: 48689
  service:
    enabled: true
    loadBalancerIP: "192.168.1.151"
    sharedIPKey: "gaming-sunshine"

# -- Fixa no worker com a RTX 3050 (unico node com GPU no cluster).
nodeSelector:
  nvidia.com/gpu.present: "true"

# -- Tolera o taint aplicado no moltres (ver kubernetes-labels.tf) que
# mantem apps genericos fora do worker com GPU.
tolerations:
  - key: nvidia.com/gpu
    value: present
    effect: NoSchedule

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: ppsspp-stream.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ROMs compartilhados com o romm, mesma PVC usada pelos outros emuladores.
extraVolumes:
  - name: roms
    persistentVolumeClaim:
      claimName: romm-library-truenas
extraVolumeMounts:
  - name: roms
    mountPath: /romm/library
  # -- Path nativo que o proprio emulador escaneia como biblioteca de
  # jogos (ver exemplo comentado no values.yaml default do chart). subPath
  # so da pasta "psp" (slug da plataforma no romm) pra aparecer
  # como lista plana.
  - name: roms
    mountPath: /roms
    subPath: roms/psp

persistence:
  config:
    enabled: true
    type: pvc
    storageClass: nfs-slowbro
    size: 10Gi

resources:
  # -- Requests subidos de 100m/256Mi para 300m/384Mi (2026-08-20): PSP e
  # um sistema leve, limits ficam como estao - so uma reserva minima
  # melhor de CPU/RAM garantidos, node (moltres) tem folga de sobra.
  # -- CPU reduzido de 300m para 150m (2026-08-23): pos-throttling incident
  # no moltres, request agregado dos 9 emuladores estava alto demais - PSP
  # e leve, 150m ja garante cgroup shares suficientes.
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    cpu: "4"
    memory: 8Gi

# NET_ADMIN escopado (2026-08-26) - substitui sunshine.privileged:true acima.
# Sunshine precisa dessa capability pra criar mouse/teclado/gamepad virtuais
# via uinput/uhid sem crashar (mesmo minimo validado no docker-compose local).
securityContext:
  capabilities:
    add:
      - NET_ADMIN
