# PCSX2 (PS2 emulator) - web KasmVNC desktop, sem database proprio (nao usa
# um Secret "-credentials" dedicado como o romm).
#
# persistence.config habilitada (PVC via nfs-slowbro) porque o BIOS
# colocado em /config/bios precisa sobreviver a um restart do pod -
# sem isso, teria que recolocar o BIOS toda vez que o pod reiniciasse.
#
# Streaming (RomM Emulator Streaming - docs.romm.app/latest/using/emulator-streaming/):
# roda o broker via Docker Mod (pcsx2-romm-integration) dentro do container
# do KasmVNC. BROKER_SECRET vem do mesmo Secret "streaming-broker-secret"
# usado pelo romm (STREAMING_BROKER_SECRET), sincronizado do Vault pelo
# VaultStaticSecret em charts/romm-extras (compartilhado entre romm e os
# emuladores com streaming habilitado).
#
# Ingress: exposto via Traefik (192.168.1.150) sob henriqzimer.com.br, pega
# o certificado wildcard automatico do Traefik (nao precisa de tls: aqui).
# DE PROPOSITO nao entra no terraform-cloudflare/tunel (so LAN) - streaming
# em tempo real nao deveria dar a volta pela rede da Cloudflare a cada
# frame. Requer DNS local: aponte pcsx2-stream.henriqzimer.com.br para
# 192.168.1.150 (via /etc/hosts no seu dispositivo ou um registro local no
# Pi-hole - 192.168.1.106).

# Forca rollout restart (2026-08-23): pega o fix do system_tray = disabled
# nos *-sunshine-mod (ghcr.io/henriqzimer) - sem isso o Sunshine destes
# pods provavelmente estava em crash loop (SIGABRT via AT_SECURE) desde que
# sunshine.enabled+privileged foram ligados, ja que so o cemu-sunshine-mod
# tinha esse workaround. DOCKER_MODS reinstala do zero a cada boot do pod
# (filesystem efemero), entao um restart sozinho ja basta pra pegar o fix -
# nao precisa rebuildar/republicar imagem nenhuma daqui.
podAnnotations:
  kubectl.kubernetes.io/restartedAt: "2026-08-23T18:09:27Z"

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Sao_Paulo"
  TITLE: "PCSX2"
  # -- Docker Mods: broker de streaming do RomM + Sunshine/Moonlight (POC).
  DOCKER_MODS: "ghcr.io/loneangelfayt/pcsx2-romm-integration-mod:latest|ghcr.io/henriqzimer/pcsx2-sunshine-mod:latest"
  # -- Precisa ser o mesmo path onde o romm monta a library (romm.persistence.library -> /romm/library).
  ROM_ROOT: "/romm/library"
  # -- Obrigatorio pro Sunshine (a imagem roda em Wayland por padrao, Sunshine so captura via Xorg/X11).
  PIXELFLUX_WAYLAND: "false"
  # -- Sem isso, a Web UI do Sunshine bloqueia por CSRF ao acessar por
  # IP em vez de localhost (confirmado: "The request was blocked by CSRF
  # protection"). O host normal (IP do node) e o Tailscale (acesso remoto).
  SUNSHINE_CSRF_ALLOWED_ORIGINS: "https://192.168.1.151:48190"
  # -- Legado da epoca de hostNetwork (sockets X11 abstratos colidiam entre
  # pods que compartilhavam a rede do node). Sem hostNetwork (ver
  # sunshine.service abaixo) cada pod tem sua propria network namespace,
  # entao isso nao e mais estritamente necessario - mantido mesmo assim,
  # sem custo, como defesa extra.
  DISPLAY: ":3"
  # -- streaming.brokerPort (abaixo) so muda o containerPort declarado no
  # Deployment - o broker.py em si le a porta de BROKER_PORT (default
  # 8000, hardcoded no proprio script), entao sem isso ele continuava
  # tentando bindar 8000 e colidindo com o dolphin mesmo com brokerPort
  # customizado no chart. Confirmado: "OSError: [Errno 98] Address already
  # in use" ao trocar de porta so no chart sem essa env.
  BROKER_PORT: "8001"
  # -- Expoe a GPU NVIDIA do node pro container. O runtime "nvidia" ja e o
  # default do containerd em talos-worker-3 (ver locals.tf do
  # terraform-homelab), entao nao precisa de RuntimeClass nem do resource
  # extendido nvidia.com/gpu (que exigiria 1 GPU inteira por pod - com 4
  # emuladores + romm no mesmo node, so um deles conseguiria agendar).
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "all"
  # -- Reduz input lag (2026-08-18): o Selkies (streaming da KasmVNC) usa
  # por padrao um pipeline pensado pra desktop parado (deteccao de "damage"
  # + paint-over, so re-encoda a regiao que mudou, com um burst de
  # qualidade quando a tela para de mudar). Pra jogo em fullscreen, tela
  # inteira muda a cada frame o tempo todo - esse pipeline so acrescenta
  # overhead. H264_STREAMING_MODE bypassa essa logica e encoda frame
  # cheio direto (confirmado no codigo do linuxserver/pixelflux: "Bypass
  # all VNC logic and work like a normal video encoder, higher constant
  # CPU usage for fullscreen gaming/videos"). CBR fixo (em vez de CRF
  # variavel) evita picos de tamanho de frame em cenas com muito
  # movimento, que geram spikes de latencia; 30Mbps e generoso pra LAN
  # gigabit com encode via NVENC (RTX 3050), sem gargalo de CPU.
  SELKIES_H264_STREAMING_MODE: "true"
  SELKIES_ENABLE_RATE_CONTROL: "true"
  SELKIES_RATE_CONTROL_MODE: "cbr"
  SELKIES_VIDEO_BITRATE: "30"
  SELKIES_FRAMERATE: "60"

envFrom:
  - secretRef:
      name: streaming-broker-secret

sunshine:
  enabled: true
  privileged: true
  # -- Porta unica por emulador (todas as outras portas do Sunshine sao
  # offsets fixos a partir desta - ver comentario no values.yaml do chart).
  port: 48189
  service:
    enabled: true
    loadBalancerIP: "192.168.1.151"
    sharedIPKey: "gaming-sunshine"

# -- Fixa no worker com a RTX 3050 (unico node com GPU no cluster).
nodeSelector:
  nvidia.com/gpu.present: "true"

# -- Subido de 2Gi (default do chart) pra 4Gi (2026-08-18): shm memory-backed,
# usado pelo mmap "fastmem" do JIT (ver o comentario de shmSize la em cima
# sobre o SIGBUS ja visto no EE recompiler) e como buffer de captura de
# tela do Selkies em full-frame streaming mode - 2Gi era justo. Cabe
# dentro do limite de memoria do pod (6Gi) com folga.
shmSize: 4Gi

streaming:
  enabled: true
  # -- brokerPort unico por emulador (legado da epoca de hostNetwork, onde
  # o broker tambem competia pela rede compartilhada do node - sem
  # hostNetwork isso nao e mais estritamente necessario, mantido por
  # consistencia com o resto do stack).
  brokerPort: 8001

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: pcsx2-stream.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ROMs/BIOS compartilhados com o romm, montados no mesmo path que o romm
# usa (/romm/library) para o broker conseguir resolver os mesmos arquivos.
extraVolumes:
  - name: roms
    persistentVolumeClaim:
      claimName: romm-library-truenas
extraVolumeMounts:
  - name: roms
    mountPath: /romm/library
  # -- BIOS do PS2 ja vive em /romm/library/bios/ps2 (mesma PVC, subPath
  # so daquela pasta) - monta por cima do /config/bios local pra nao
  # precisar duplicar o BIOS numa segunda PVC.
  - name: roms
    mountPath: /config/bios
    subPath: bios/ps2
  # -- Path nativo que o proprio PCSX2 escaneia como biblioteca de jogos
  # (ver exemplo comentado no values.yaml default do chart). subPath so
  # da pasta ps2 pra aparecer como lista plana de jogos, sem misturar com
  # os outros sistemas que ficam em /romm/library/roms/<outra-plataforma>.
  - name: roms
    mountPath: /roms
    subPath: roms/ps2

persistence:
  config:
    enabled: true
    type: pvc
    storageClass: nfs-slowbro
    size: 10Gi

resources:
  # -- Requests subidos de 100m/256Mi para 500m/512Mi (2026-08-18): reserva
  # um pouco mais de CPU/RAM garantidos (cgroup shares) pra nao sofrer
  # throttling quando outro pod no mesmo node (moltres) tambem estiver sob
  # carga. O node tem folga de sobra - ver `kubectl top node moltres`.
  requests:
    cpu: 500m
    memory: 512Mi
  # -- Memoria subida de 6Gi para 8Gi (2026-08-18): folga extra pro shm de
  # 4Gi (acima) + o proprio PCSX2, com sobra no node pra isso.
  limits:
    cpu: "3"
    memory: 8Gi
