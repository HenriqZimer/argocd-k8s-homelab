# Overlay de recursos (requests/limits de memoria). Base: values/networking/metallb.yaml
# Medido em 2026-10-30 com `kubectl top` + recomendacoes do VPA/Goldilocks: request ~ uso
# observado, limit com folga (2-4x). Sem limite, um vazamento derruba o no inteiro.
controller:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
speaker:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
