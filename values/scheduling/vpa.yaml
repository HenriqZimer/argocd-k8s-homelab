# So o recommender - modo "so recomendacao", sem resize automatico de pods.
# O Goldilocks le as recomendacoes do recommender pra exibir no dashboard.
recommender:
  enabled: true
  replicaCount: 1
  extraArgs:
    # Padrao 1m: com ~100 VPAs (Goldilocks liga em todos os namespaces) o
    # recommender gerava ~50k escritas em 5h no kube-apiserver (status + checkpoints).
    # So recomendacao (nada e redimensionado), entao 5m e suficiente.
    recommender-interval: 5m0s

updater:
  enabled: false

admissionController:
  enabled: false
