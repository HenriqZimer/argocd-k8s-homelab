image:
  repository: ollama/ollama
  pullPolicy: IfNotPresent

replicaCount: 1

# GPU passthrough: so o worker "moltres" tem a RTX 3050 (ver worker_gpu_pci_ids
# no terraform-homelab), e o runtime "nvidia" ja e o default do containerd
# nesse node - nao precisa de runtimeClassName por pod.
#
# Modelo unico (qwen3-vl:8b, ~6.1GB em Q4) em vez de dois modelos menores - a RTX 3050 tem 8GB
# de VRAM, e dois modelos residentes ao mesmo tempo nao deixariam folga pra contexto/overhead do
# encoder de visao (risco de estourar VRAM e o Ollama ficar descarregando/recarregando modelo a
# cada troca, pior que a fila unica de hoje). Substitui o qwen3.5:4b anterior.
ollama:
  gpu:
    enabled: true
    type: "nvidia"
    number: 1
  models:
    pull:
      - qwen3-vl:8b
    run: []

nodeSelector:
  nvidia.com/gpu.present: "true"

# -- Tolera o taint aplicado no moltres (ver kubernetes-labels.tf) que
# mantem apps genericos fora do worker com GPU.
tolerations:
  - key: nvidia.com/gpu
    value: present
    effect: NoSchedule

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# Modelos ficam no PVC (NFS), nao no disco local da VM.
persistentVolume:
  enabled: true
  size: 50Gi

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: ollama.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []
