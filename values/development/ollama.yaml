image:
  repository: ollama/ollama
  pullPolicy: IfNotPresent

replicaCount: 1

# GPU passthrough: so o worker "moltres" tem a RTX 3050 (ver worker_gpu_pci_ids
# no terraform-homelab), e o runtime "nvidia" ja e o default do containerd
# nesse node - nao precisa de runtimeClassName por pod.
#
# Modelo unico (~6.1GB em Q4) em vez de dois modelos menores - a RTX 3050 tem 8GB de VRAM, e dois
# modelos residentes ao mesmo tempo nao deixariam folga pra contexto/overhead do encoder de
# visao. Substitui o qwen3.5:4b anterior.
#
# "-instruct", NAO a tag "qwen3-vl:8b" pura: essa (sem sufixo) e a variante "thinking" - gera um
# bloco <think>...</think> gigante antes de responder e IGNORA a opcao think:false (bug conhecido,
# ollama/ollama#14798 - falta o template que permite desligar o raciocinio nessa tag). Cada
# chamada real (classificar imagem, revisar evidencia) levava 5-8 minutos e as vezes voltava
# vazia (estourava algum limite ainda "pensando"). "-instruct" e a variante sem raciocinio,
# recomendada pra pipeline de producao (~45-60 tok/s numa 4090; aqui, mais devagar, mas sem o
# overhead do thinking).
ollama:
  # O volume "ollama-data" (emptyDir, ver persistentVolume abaixo) fica aqui, fora de /root/.ollama.
  mountPath: /tmp/ollama-data-unused
  gpu:
    enabled: true
    type: "nvidia"
    number: 1
  models:
    pull:
      - qwen3-vl:8b-instruct
    run: []

nodeSelector:
  nvidia.com/gpu.present: "true"

# -- Tolera o taint aplicado no moltres (ver kubernetes-labels.tf) que
# mantem apps genericos fora do worker com GPU.
tolerations:
  - key: nvidia.com/gpu
    value: present
    effect: NoSchedule

resources:
  requests:
    cpu: 1000m
    memory: 4Gi
  limits:
    cpu: 4000m
    memory: 16Gi

# Modelos no DISCO LOCAL do moltres (hostPath), nao no PVC em NFS (slowbro). Teste de 19/10 com o
# mesmo arquivo de 6,1GB (qwen3-vl:8b-instruct), leitura direta: local ~1000 MB/s x NFS ~13 MB/s
# (~75x). No NFS a primeira carga do modelo levava ~8 min e estourava o timeout do llama-server
# ("timed out waiting for llama-server to start"), deixando a analise de IA sem resposta.
# O pod ja roda so no moltres (nodeSelector da GPU), entao a dependencia do no nao muda nada.
# /var/lib e o disco EPHEMERAL do Talos: sobrevive a reboot, mas e apagado se o no for recriado
# (os modelos sao re-baixaveis: `ollama pull`).
#
# persistentVolume desligado: o volume "ollama-data" do chart vira um emptyDir inofensivo montado
# fora do caminho (ollama.mountPath abaixo); os modelos vem do hostPath em /root/.ollama.
persistentVolume:
  enabled: false

volumes:
  - name: models-local
    hostPath:
      path: /var/lib/ollama-models
      type: DirectoryOrCreate

volumeMounts:
  - name: models-local
    mountPath: /root/.ollama

# Mantem o modelo na VRAM (sem descarregar por ociosidade: a carga a frio e o gargalo) e da mais
# tempo pra uma carga a frio terminar.
extraEnv:
  - name: OLLAMA_KEEP_ALIVE
    value: "-1"
  - name: OLLAMA_LOAD_TIMEOUT
    value: "15m"
  # Flash attention + cache de contexto (KV) em q8_0: o KV cai pela metade (~2,4GB -> ~1,2GB com
  # contexto 16384) com perda de qualidade desprezivel, o que deixa mais camadas do qwen3-vl 8B na
  # GPU (RTX 3050 de 8GB; hoje ~63% GPU / 37% CPU no contexto 16384, 2,5 tok/s). Medido em
  # 19/10: contexto 8192 ja da 5,6 tok/s (73% GPU); o 4B (qwen3-vl:4b-instruct) roda 100% na GPU
  # a ~40 tok/s. Reavaliar depois deste ajuste com `ollama ps` (coluna PROCESSOR).
  - name: OLLAMA_FLASH_ATTENTION
    value: "1"
  - name: OLLAMA_KV_CACHE_TYPE
    value: "q8_0"

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: ollama.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []
