image:
  repository: ollama/ollama
  pullPolicy: IfNotPresent

# Temporariamente 0 pra liberar a unica GPU do cluster (moltres) pro teste
# do cemu-helm-chart (Wii U via Vulkan software/llvmpipe e impraticavel).
# Reverter (voltar pra 1, ou remover essa linha) quando o teste terminar.
replicaCount: 0

# GPU passthrough: so o worker "moltres" tem a RTX 3050 (ver worker_gpu_pci_ids
# no terraform-homelab), e o runtime "nvidia" ja e o default do containerd
# nesse node - nao precisa de runtimeClassName por pod.
ollama:
  gpu:
    enabled: true
    type: "nvidia"
    number: 1
  models:
    pull:
      - qwen3.5:4b
    run: []

nodeSelector:
  nvidia.com/gpu.present: "true"

# -- Tolera o taint aplicado no moltres (ver kubernetes-labels.tf) que
# mantem apps genericos fora do worker com GPU.
tolerations:
  - key: nvidia.com/gpu
    value: present
    effect: NoSchedule

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# Modelos ficam no PVC (NFS), nao no disco local da VM.
persistentVolume:
  enabled: true
  size: 50Gi

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: ollama.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []
