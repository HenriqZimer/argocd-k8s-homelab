# LiteLLM (AI Gateway) - chart oci://docker.litellm.ai/berriai/litellm-helm
# Backend: Ollama do cluster (development/ollama). Provedores em nuvem: ver o
# comentario no fim do model_list.
#
# Secrets (via Vault + VSO, ver charts/litellm-extras):
#   k8s-homelab/litellm              -> litellm-secrets (masterkey [+ chaves de provedores])
#   k8s-homelab/postgresql/litellm   -> litellm-db-credentials (banco no CloudNativePG)

image:
  pullPolicy: IfNotPresent

masterkeySecretName: litellm-secrets
masterkeySecretKey: masterkey

# Chaves de provedores (GEMINI_API_KEY, ...) entram como variaveis de ambiente
# a partir do mesmo Secret.
environmentSecrets: [litellm-secrets]

# Postgres compartilhado (CloudNativePG) em vez do subchart do Bitnami.
db:
  useExisting: true
  deployStandalone: false
  endpoint: postgresql-rw.postgresql.svc.cluster.local
  database: litellm
  secret:
    name: litellm-db-credentials
    usernameKey: username
    passwordKey: password

# O Job de migracao nativo e um hook PreSync, que roda ANTES do VaultStaticSecret
# existir (primeiro sync: o Job falharia sem o Secret do banco). Como Sync na wave -1
# ele roda depois dos secrets (wave -2) e antes do Deployment, e o BeforeHookCreation
# evita o app ficar OutOfSync por causa do ttlSecondsAfterFinished.
migrationJob:
  hooks:
    argocd:
      enabled: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi } # com 1Gi o Prisma foi morto por OOM (exit 137)

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: litellm.henriqzimer.com.br
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { memory: 2Gi }

# zapdos (8GB) chegou a 87% de requests e o OOM controller do Talos matava pods; o moltres
# (32GB) tem folga. Tolera o taint de GPU (nao usa a GPU) e prefere o moltres.
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [moltres]

proxy_config:
  model_list:
    # Modelos locais (Ollama no cluster) com API OpenAI-compativel
    - model_name: qwen3-vl-8b
      litellm_params:
        model: ollama_chat/qwen3-vl:8b-instruct
        api_base: http://ollama.development.svc.cluster.local:11434
        input_cost_per_token: 0.000001 # preco ficticio (US$1/1M tokens) p/ demo de budget
        output_cost_per_token: 0.000002
    - model_name: qwen3-vl-4b
      litellm_params:
        model: ollama_chat/qwen3-vl:4b-instruct
        api_base: http://ollama.development.svc.cluster.local:11434
        input_cost_per_token: 0.000001
        output_cost_per_token: 0.000002
    # Alias com load balancing entre os dois modelos
    - model_name: qwen3-vl
      litellm_params:
        model: ollama_chat/qwen3-vl:8b-instruct
        api_base: http://ollama.development.svc.cluster.local:11434
        input_cost_per_token: 0.000001
        output_cost_per_token: 0.000002
    - model_name: qwen3-vl
      litellm_params:
        model: ollama_chat/qwen3-vl:4b-instruct
        api_base: http://ollama.development.svc.cluster.local:11434
        input_cost_per_token: 0.000001
        output_cost_per_token: 0.000002
    # Provedores em nuvem: grave a chave em k8s-homelab/litellm (ex.: GEMINI_API_KEY)
    # e acrescente aqui, p.ex.:
    # - model_name: gemini-flash
    #   litellm_params:
    #     model: gemini/<modelo disponivel na sua conta>
    #     api_key: os.environ/GEMINI_API_KEY

  litellm_settings:
    drop_params: true
    num_retries: 2
    request_timeout: 300
    cache: true # cache em memoria (1 replica). Multi-replica -> Redis
    cache_params: { type: local }
    fallbacks:
      - qwen3-vl-8b: [qwen3-vl-4b]

  # ---- Guardrails (litellm_content_filter: embutido, roda local, sem API externa) ----
  guardrails:
    - guardrail_name: pii-filter
      litellm_params:
        guardrail: litellm_content_filter
        mode: pre_call
        patterns:
          - { pattern_type: prebuilt, pattern_name: email, action: MASK }
          - { pattern_type: prebuilt, pattern_name: us_ssn, action: BLOCK }
          - { pattern_type: prebuilt, pattern_name: aws_access_key, action: BLOCK }
          - { pattern_type: prebuilt, pattern_name: github_token, action: BLOCK }
          - { pattern_type: regex, name: cpf, pattern: '\b\d{3}\.\d{3}\.\d{3}-\d{2}\b', action: MASK }
        blocked_words:
          - { keyword: confidencial, action: BLOCK }
    - guardrail_name: injection-filter
      litellm_params:
        guardrail: litellm_content_filter
        mode: pre_call
        categories:
          - { category: prompt_injection_jailbreak, enabled: true, action: BLOCK, severity_threshold: medium }
          - { category: prompt_injection_system_prompt, enabled: true, action: BLOCK, severity_threshold: medium }

  # ---- Policies: "base" em tudo; "estrita" (com anti-injection) so nos modelos externos ----
  policies:
    base:
      guardrails: { add: [pii-filter] }
    estrita:
      inherit: base
      guardrails: { add: [injection-filter] }
  policy_attachments:
    - { policy: base, scope: "*" }
    - { policy: estrita, models: ["gemini-*"] }

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    store_model_in_db: true # permite adicionar modelos pela UI

  # MCP Gateway: expoe tools de MCP servers atraves do gateway (/mcp)
  mcp_servers:
    deepwiki:
      url: https://mcp.deepwiki.com/mcp
      transport: http
      description: "DeepWiki - consulta documentacao de repositorios GitHub publicos"
