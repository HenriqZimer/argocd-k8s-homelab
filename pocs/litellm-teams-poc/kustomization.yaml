apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - sync/teams-job.yaml
  - sync/mcp-servers-job.yaml
configMapGenerator:
  - name: litellm-teams-poc-spec
    files:
      - teams/cliente-a.json
      - teams/cliente-b.json
      - teams/claude-pro.json
      - teams/claude-subscription-users.json
    options:
      disableNameSuffixHash: true
  - name: litellm-mcp-poc-spec
    files:
      - mcp/servers/deepwiki-poc.json
      - mcp/servers/studio.json
    options:
      disableNameSuffixHash: true
