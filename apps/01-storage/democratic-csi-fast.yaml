apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi-fast
  namespace: development
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: homelab
  sources:
    - repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      targetRevision: "0.15.1"
      helm:
        valueFiles:
          - $values/values/storage/democratic-csi-fast.yaml
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        # Controller/node do CSI sao privilegiados (hostPID, mounts do host)
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
