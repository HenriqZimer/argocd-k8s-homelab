apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: development
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: homelab
  sources:
    - repoURL: https://charts.fairwinds.com/stable
      chart: vpa
      targetRevision: "5.0.0"
      helm:
        valueFiles:
          - $values/values/scheduling/vpa.yaml
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: scheduling
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
