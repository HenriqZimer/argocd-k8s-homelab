apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: development
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: homelab
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: "2.19.0"
      helm:
        valueFiles:
          - $values/values/scheduling/keda.yaml
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: scheduling
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
