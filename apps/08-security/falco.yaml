apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: development
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: homelab
  sources:
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: "9.1.0"
      helm:
        valueFiles:
          - $values/values/security/falco.yaml
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
