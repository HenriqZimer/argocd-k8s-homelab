apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: development
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: homelab
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: "3.9.2"
      helm:
        valueFiles:
          - $values/values/security/kyverno.yaml
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  # O chart renderiza "labels: {}" nas CRDs de policies.kyverno.io; o API server
  # descarta o mapa vazio, entao o Argo via diff eterno (OutOfSync) so por isso.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.labels | select(. == {})
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs de policy report do Kyverno estouram o limite de 262144 bytes
      # da annotation last-applied-configuration do apply client-side.
      - ServerSideApply=true
