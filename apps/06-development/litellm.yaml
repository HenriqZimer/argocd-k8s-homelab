apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: development
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: homelab
  sources:
    - repoURL: docker.litellm.ai/berriai
      chart: litellm-helm
      targetRevision: "1.108.0"
      helm:
        valueFiles:
          - $values/values/development/litellm/00-infrastructure.yaml
          - $values/values/development/litellm/10-models.yaml
          - $values/values/development/litellm/20-guardrails.yaml
          - $values/values/development/litellm/30-policies.yaml
          - $values/values/development/litellm/40-mcp.yaml
          - $values/values/development/litellm/50-runtime.yaml
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      path: charts/litellm-extras
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
