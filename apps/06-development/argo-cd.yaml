apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: development
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: homelab
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "10.4.0"
      helm:
        # Sem isso, o Argo CD usa o nome da propria Application ("argo-cd")
        # como prefixo dos recursos renderizados - diferente do release
        # "argocd-bootstrap" criado manualmente no primeiro bootstrap (ver
        # Makefile bootstrap-argocd) - resultando numa SEGUNDA instalacao
        # completa do Argo CD rodando em paralelo, em vez desta Application
        # assumir o gerenciamento dos recursos que ja existem.
        releaseName: argocd-bootstrap
        valueFiles:
          - $values/values/development/argo-cd.yaml
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      path: charts/argo-cd-extras
  destination:
    server: https://kubernetes.default.svc
    namespace: development
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
