apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: romm
  namespace: development
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: homelab
  sources:
    - repoURL: https://henriqzimer.github.io/romm-helm-chart
      chart: romm
      targetRevision: "1.3.0"
      helm:
        valueFiles:
          - $values/values/gaming/romm.yaml
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      path: charts/romm-extras
  destination:
    server: https://kubernetes.default.svc
    namespace: gaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
