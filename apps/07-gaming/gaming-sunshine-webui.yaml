apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gaming-sunshine-webui
  namespace: development
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: homelab
  source:
    repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
    targetRevision: main
    path: charts/gaming-sunshine-webui
  destination:
    server: https://kubernetes.default.svc
    namespace: gaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
