apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xemu
  namespace: development
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: homelab
  sources:
    - repoURL: https://henriqzimer.github.io/xemu-helm-chart
      chart: xemu
      targetRevision: "1.4.6"
      helm:
        # replicaCount: 0 (desativado, servido pelo webstation) - o
        # values.schema.json do chart exige minimum 1.
        skipSchemaValidation: true
        valueFiles:
          - $values/values/gaming/xemu.yaml
    - repoURL: https://github.com/henriqzimer/argocd-k8s-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: gaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
