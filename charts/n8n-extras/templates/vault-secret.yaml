apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: n8n-credentials-sync
  namespace: {{ .Values.namespace }}
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: n8n-credentials
  refreshAfter: 1m
  destination:
    name: n8n-credentials
    create: true
    type: Opaque
    transformation:
      templates:
        host:
          text: '{{ "{{" }} get .Secrets "host" {{ "}}" }}'
        port:
          text: '{{ "{{" }} get .Secrets "port" {{ "}}" }}'
        database:
          text: '{{ "{{" }} get .Secrets "database" {{ "}}" }}'
        user:
          text: '{{ "{{" }} get .Secrets "username" {{ "}}" }}'
        password:
          text: '{{ "{{" }} get .Secrets "password" {{ "}}" }}'
        encryption_key:
          text: '{{ "{{" }} get .Secrets "encryption_key" {{ "}}" }}'
---
# Banco do n8n no cluster PostgreSQL compartilhado (CloudNativePG).
# Senha em k8s-homelab/postgresql/n8n (chave "password").
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: n8n-db-credentials-sync
  namespace: {{ .Values.namespace }}
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: postgresql/n8n
  refreshAfter: 1m
  destination:
    name: n8n-db-credentials
    create: true
    overwrite: true
    type: Opaque
    transformation:
      templates:
        host:
          text: postgresql-rw.postgresql.svc.cluster.local
        port:
          text: "5432"
        database:
          text: n8n
        username:
          text: n8n
        password:
          text: '{{ "{{" }} get .Secrets "password" {{ "}}" }}'
