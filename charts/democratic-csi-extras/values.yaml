namespace: storage

# Conteudo de driver-config-file.yaml do democratic-csi.
# __API_KEY__ e trocado pelo valor do Vault (k8s-homelab/truenas-api, api_key).
config:
  driver: freenas-api-iscsi
  instance_id:
  httpConnection:
    protocol: http
    host: 192.168.1.102
    port: 80
    apiKey: __API_KEY__
    allowInsecure: true
    apiVersion: 2
  zfs:
    # datasetParentName e detachedSnapshotsDatasetParentName sao irmaos
    # sob slowbro/kubernetes (um nao pode ser filho do outro).
    datasetParentName: slowbro/kubernetes/vols
    detachedSnapshotsDatasetParentName: slowbro/kubernetes/snapshots
    zvolCompression:
    zvolDedup:
    zvolEnableReservation: false
    zvolBlocksize:
  iscsi:
    targetPortal: "192.168.1.102:3260"
    targetPortals: []
    namePrefix: csi-
    nameSuffix: "-homelab"
    # targetGroupPortalGroup: ID do portal ja criado no TrueNAS (Sharing -> iSCSI).
    # targetGroupInitiatorGroup vazio = qualquer initiator (o grupo de initiators
    # foi removido do TrueNAS; com ID 1 o provisionamento falha com
    # "1 Initiator not found in database").
    targetGroups:
      - targetGroupPortalGroup: 1
        targetGroupInitiatorGroup:
        targetGroupAuthType: None
        targetGroupAuthGroup:
    extentInsecureTpc: true
    extentXenCompat: false
    extentDisablePhysicalBlocksize: true
    extentBlocksize: 512
    extentRpm: "SSD"
    extentAvailThreshold: 0

# Segunda instancia do driver, no pool SSD "fastbro" (sde, 100GB). Usa a mesma
# API key; so mudam os datasets e o sufixo do IQN. Releases do democratic-csi
# diferentes precisam de csiDriver.name proprio (ver democratic-csi-fast.yaml).
fast:
  enabled: true
  datasetParentName: fastbro/kubernetes/vols
  detachedSnapshotsDatasetParentName: fastbro/kubernetes/snapshots
  nameSuffix: "-fast"
