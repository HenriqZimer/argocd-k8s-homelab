apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: role-k8s-homelab
    serviceAccount: default
---
# Admin, chaves da aplicacao e senha do Valkey: k8s-homelab/defectdojo-credentials
# Chaves: DD_ADMIN_PASSWORD, DD_SECRET_KEY, DD_CREDENTIAL_AES_256_KEY,
# METRICS_HTTP_AUTH_PASSWORD, valkey-password
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: defectdojo-credentials-sync
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: defectdojo-credentials
  refreshAfter: 1m
  destination:
    name: defectdojo
    create: true
    overwrite: true
    type: Opaque
    transformation:
      templates:
        DD_ADMIN_PASSWORD:
          text: '{{ "{{" }} get .Secrets "DD_ADMIN_PASSWORD" {{ "}}" }}'
        DD_SECRET_KEY:
          text: '{{ "{{" }} get .Secrets "DD_SECRET_KEY" {{ "}}" }}'
        DD_CREDENTIAL_AES_256_KEY:
          text: '{{ "{{" }} get .Secrets "DD_CREDENTIAL_AES_256_KEY" {{ "}}" }}'
        METRICS_HTTP_AUTH_PASSWORD:
          text: '{{ "{{" }} get .Secrets "METRICS_HTTP_AUTH_PASSWORD" {{ "}}" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: defectdojo-valkey-sync
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: defectdojo-credentials
  refreshAfter: 1m
  destination:
    name: defectdojo-valkey-specific
    create: true
    overwrite: true
    type: Opaque
    transformation:
      templates:
        valkey-password:
          text: '{{ "{{" }} get .Secrets "valkey-password" {{ "}}" }}'
---
# Banco no cluster PostgreSQL compartilhado: k8s-homelab/postgresql/defectdojo
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: defectdojo-postgresql-sync
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: postgresql/defectdojo
  refreshAfter: 1m
  destination:
    name: defectdojo-postgresql-specific
    create: true
    overwrite: true
    type: Opaque
    transformation:
      templates:
        postgresql-password:
          text: '{{ "{{" }} get .Secrets "password" {{ "}}" }}'
