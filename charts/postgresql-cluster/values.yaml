namespace: postgresql

cluster:
  name: postgresql
  instances: 3
  # Replicas em nos diferentes (obrigatorio): queda de um no nao derruba o banco
  enablePodAntiAffinity: true
  podAntiAffinityType: required
  topologyKey: kubernetes.io/hostname
  # Tag de minor fixa. Subir de major muda o imageName e o CNPG roda pg_upgrade offline (fazer dump antes);
  # pg_upgrade planejado; subir de minor e so trocar a tag.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  imagePullPolicy: IfNotPresent
  storage:
    storageClass: freenas-iscsi-fast
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  parameters:
    max_connections: "100"
    shared_buffers: 128MB

# Um banco + um usuario por servico. Para cada item:
#   1. grave a senha no Vault: k8s-homelab/postgresql/<name> com a chave "password"
#      (nomes com "_" viram "-" nos recursos do Kubernetes)
#   2. adicione o item aqui e faca o commit
# Exemplo:
#   - name: vaultwarden
#     extensions: []        # ex.: [pg_trgm]
databases:
  - name: vaultwarden
    extensions: []
  - name: grafana
    extensions: []
  - name: romm
    extensions: []
  - name: n8n
    extensions: ["uuid-ossp"]
  # Backend de storage do proprio Vault: a senha NAO vem do Vault (dependencia
  # circular). O Secret postgresql-vault-credentials e criado a mao (kubectl).
  - name: vault
    extensions: []
    vaultSecret: false
  - name: avisa_dev
    extensions: []
  - name: avisa_staging
    extensions: []
  - name: avisa_prod
    extensions: []
  - name: defectdojo
    extensions: []
