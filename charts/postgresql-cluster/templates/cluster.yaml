apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Values.namespace }}
spec:
  instances: {{ .Values.cluster.instances }}
  imageName: {{ .Values.cluster.imageName }}
  imagePullPolicy: {{ .Values.cluster.imagePullPolicy }}
  affinity:
    enablePodAntiAffinity: {{ .Values.cluster.enablePodAntiAffinity }}
    podAntiAffinityType: {{ .Values.cluster.podAntiAffinityType }}
    topologyKey: {{ .Values.cluster.topologyKey }}
    # Fora dos nos do Karpenter (efemeros: consolidacao/expiracao derrubaria replicas)
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: karpenter.sh/nodepool
                operator: DoesNotExist
  storage:
    storageClass: {{ .Values.cluster.storage.storageClass }}
    size: {{ .Values.cluster.storage.size }}
  resources:
    {{- toYaml .Values.cluster.resources | nindent 4 }}
  postgresql:
    parameters:
      {{- toYaml .Values.cluster.parameters | nindent 6 }}
  {{- with .Values.databases }}
  managed:
    roles:
      {{- range . }}
      - name: {{ .name }}
        ensure: present
        login: true
        # defaults que o webhook do CNPG preenche; explicitos para o Argo nao ver diff
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: postgresql-{{ .name }}-credentials
      {{- end }}
  {{- end }}
