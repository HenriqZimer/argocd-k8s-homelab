{{- range .Values.databases }}
{{- if ne (toString .vaultSecret) "false" }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgresql-{{ .name | replace "_" "-" }}-credentials-sync
  namespace: {{ $.Values.namespace }}
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: postgresql/{{ .name }}
  refreshAfter: 1m
  destination:
    name: postgresql-{{ .name | replace "_" "-" }}-credentials
    create: true
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
    transformation:
      templates:
        username:
          text: {{ .name | quote }}
        password:
          text: '{{ "{{" }} get .Secrets "password" {{ "}}" }}'
{{- end }}
{{- end }}
