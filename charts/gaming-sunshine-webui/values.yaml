# -- Cada entrada gera um Service (seleciona o pod pelas labels padrao do
# chart do emulador, app.kubernetes.io/name=<name>) + uma IngressRoute
# (CRD do Traefik, nao Ingress comum - ver comentario no template) pra
# porta da Web UI do Sunshine (base+1, offset fixo do Sunshine). Segue
# funcionando igual apos a migracao de hostNetwork pra sunshine.service
# (LoadBalancer, 2026-08-23): o selector aponta pro pod normal (nao mais
# pro IP do node) e o containerPort sun-web continua exposto do mesmo
# jeito, entao o roteamento via kube-proxy funciona sem mudanca nenhuma
# aqui - so o hostNetwork em si que deixou de ser necessario.
emulators:
  - name: dolphin
    host: dolphin-sunshine.henriqzimer.com.br
    webPort: 47990
  - name: azahar
    host: azahar-sunshine.henriqzimer.com.br
    webPort: 48090
  - name: pcsx2
    host: pcsx2-sunshine.henriqzimer.com.br
    webPort: 48190
  - name: rpcs3
    host: rpcs3-sunshine.henriqzimer.com.br
    webPort: 48290
  - name: xemu
    host: xemu-sunshine.henriqzimer.com.br
    webPort: 48390
  - name: flycast
    host: flycast-sunshine.henriqzimer.com.br
    webPort: 48490
  - name: eden
    host: eden-sunshine.henriqzimer.com.br
    webPort: 48590
  - name: ppsspp
    host: ppsspp-sunshine.henriqzimer.com.br
    webPort: 48690
  - name: shadps4
    host: shadps4-sunshine.henriqzimer.com.br
    webPort: 48790

ingressClassName: traefik
