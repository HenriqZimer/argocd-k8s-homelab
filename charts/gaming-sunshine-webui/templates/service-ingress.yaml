{{- range .Values.emulators }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-sunshine-webui
  namespace: gaming
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/component: sunshine-webui
spec:
  # -- Seleciona o mesmo pod do Deployment do emulador pelas labels
  # padrao do chart (app.kubernetes.io/name/instance) - como o pod e
  # hostNetwork:true, o "pod IP" que o Service usa como endpoint E o IP
  # do node, entao isso funciona sem hardcodar IP em lugar nenhum.
  selector:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/instance: {{ .name }}
  ports:
    - name: https
      port: 443
      targetPort: {{ .webPort }}
      protocol: TCP
---
# IngressRoute (CRD nativa do Traefik) em vez de Ingress + anotacoes: o
# ServersTransport referenciado via anotacao
# ("traefik.ingress.kubernetes.io/service.serverstransport") num Ingress
# comum falhava com "servers transport not found ...@kubernetescrd" mesmo
# com o recurso existindo e a anotacao no lugar certo (Service, nao
# Ingress - ja corrigimos isso, mas o erro persistiu). IngressRoute tem o
# campo serversTransport tipado direto no service, sem essa resolucao
# fragil por string - resolve de vez.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .name }}-sunshine-webui
  namespace: gaming
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/component: sunshine-webui
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .host }}`)
      kind: Rule
      services:
        - name: {{ .name }}-sunshine-webui
          port: 443
          scheme: https
          serversTransport: gaming-sunshine-webui-insecure
  tls: {}
---
{{- end }}
