apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-admin
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-admin
subjects:
  - kind: ServiceAccount
    name: dashboard-admin
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
# Desde o Kubernetes 1.24 tokens de ServiceAccount nao sao mais gerados
# automaticamente - esse Secret e o jeito declarativo de pedir um (de longa
# duracao) pro login por token no Dashboard.
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-admin-token
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/service-account.name: dashboard-admin
type: kubernetes.io/service-account-token
