apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-credentials-sync
  namespace: {{ .Values.namespace }}
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: grafana-credentials
  refreshAfter: 1m
  destination:
    name: grafana-credentials
    create: true
    overwrite: true
    type: Opaque
    transformation:
      templates:
        admin-user:
          text: '{{ "{{" }} get .Secrets "admin-user" {{ "}}" }}'
        admin-password:
          text: '{{ "{{" }} get .Secrets "admin-password" {{ "}}" }}'
        postgres-url:
          text: '{{ "{{" }} get .Secrets "postgres-url" {{ "}}" }}'
        POSTGRES_URL:
          text: '{{ "{{" }} get .Secrets "postgres-url" {{ "}}" }}'
---
# Banco do Grafana no cluster PostgreSQL compartilhado (CloudNativePG).
# Senha em k8s-homelab/postgresql/grafana (chave "password").
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-db-credentials-sync
  namespace: {{ .Values.namespace }}
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: postgresql/grafana
  refreshAfter: 1m
  destination:
    name: grafana-db-credentials
    create: true
    overwrite: true
    type: Opaque
    transformation:
      templates:
        GF_DATABASE_URL:
          text: 'postgres://grafana:{{ "{{" }} get .Secrets "password" {{ "}}" }}@postgresql-rw.postgresql.svc.cluster.local:5432/grafana?sslmode=disable'
