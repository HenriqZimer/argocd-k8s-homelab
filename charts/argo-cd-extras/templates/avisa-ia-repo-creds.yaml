apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: avisa-ia-repo-creds-sync
  namespace: {{ .Values.namespace }}
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: argocd-secret
  refreshAfter: 1m
  destination:
    name: avisa-ia-repo-creds
    create: true
    overwrite: true
    type: Opaque
    # Label "repo-creds" (nao "repository"): o Argo CD aplica essas
    # credenciais a QUALQUER repo cuja URL comece com o prefixo abaixo,
    # sem precisar cadastrar cada repositorio do avisa-ia individualmente.
    labels:
      argocd.argoproj.io/secret-type: repo-creds
    transformation:
      templates:
        type:
          text: git
        url:
          text: https://gitlab.com/avisa-ia
        username:
          text: '{{ "{{" }} get .Secrets "gitlab-username" {{ "}}" }}'
        password:
          text: '{{ "{{" }} get .Secrets "gitlab-token" {{ "}}" }}'
