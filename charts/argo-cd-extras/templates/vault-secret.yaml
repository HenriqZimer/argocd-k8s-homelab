apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-secrets-sync
  namespace: {{ .Values.namespace }}
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: argocd-secret
  refreshAfter: 1m
  destination:
    name: argocd-secret
    create: true
    overwrite: true
    type: Opaque
    transformation:
      templates:
        # Nomes com ponto, nao hifen: o proprio Argo CD (settings manager)
        # le essas chaves literalmente do Secret ("server.secretkey",
        # "admin.password") - "server-secretkey"/"admin-password" nunca
        # eram lidos por nada, so ficavam la sem efeito.
        admin.password:
          text: '{{ "{{" }} get .Secrets "admin.password" {{ "}}" }}'
        server.secretkey:
          text: '{{ "{{" }} get .Secrets "server.secretkey" {{ "}}" }}'
