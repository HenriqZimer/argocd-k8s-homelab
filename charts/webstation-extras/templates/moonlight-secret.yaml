# Client token do RomM usado pelo webstation-sunshine-mod pra montar a lista
# de jogos do Moonlight e abrir cada jogo pela API de streaming do RomM.
# Criar no RomM (perfil > client tokens) com os escopos roms.read +
# roms.user.write e gravar no Vault em k8s-homelab/webstation-moonlight,
# chave ROMM_API_TOKEN. Enquanto nao existir, o pod sobe normal (envFrom
# optional) e o Moonlight mostra so o app "Webstation".
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: webstation-moonlight-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: webstation-moonlight
  refreshAfter: 1m
  destination:
    name: webstation-moonlight
    create: true
    overwrite: true
    type: Opaque
    transformation:
      templates:
        ROMM_API_TOKEN:
          text: '{{ "{{" }} get .Secrets "ROMM_API_TOKEN" {{ "}}" }}'
