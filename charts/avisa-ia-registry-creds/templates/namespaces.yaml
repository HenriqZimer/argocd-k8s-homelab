{{- range .Values.newNamespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: {{ . }}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: role-k8s-homelab
    serviceAccount: default
---
{{- end }}
