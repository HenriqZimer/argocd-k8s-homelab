{{- range .Values.namespaces }}
# VaultAuth "default" ja existe em avisa-ia-dev/staging/prod (criado pelo
# app avisa-ia-vault-setup) - so declarado aqui pra avisa-ia-homolog (ver
# namespaces.yaml), pra nao gerar conflito de "shared resource" entre duas
# Applications donas do mesmo objeto.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitlab-registry-creds-sync
  namespace: {{ . }}
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: k8s-homelab
  path: argocd-secret
  refreshAfter: 1m
  destination:
    name: gitlab-registry-creds
    create: true
    overwrite: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      templates:
        # Chave literal ".dockerconfigjson" (com ponto): e o campo que o
        # kubelet espera para o tipo de secret kubernetes.io/dockerconfigjson
        # ao usar imagePullSecrets. registry-username/registry-token vem do
        # mesmo path k8s-homelab/argocd-secret usado pelo repo-creds do
        # Argo CD (token diferente: esse precisa de escopo "Read Registry",
        # o do repo-creds precisa de "Code: Download").
        .dockerconfigjson:
          text: |
            {{ "{{-" }} $username := get .Secrets "registry-username" {{ "-}}" }}
            {{ "{{-" }} $token := get .Secrets "registry-token" {{ "-}}" }}
            {{ "{{-" }} $auth := printf "%s:%s" $username $token | b64enc {{ "-}}" }}
            {"auths":{"registry.gitlab.com":{"username":"{{ "{{" }} $username {{ "}}" }}","password":"{{ "{{" }} $token {{ "}}" }}","auth":"{{ "{{" }} $auth {{ "}}" }}"}}}
---
{{- end }}
