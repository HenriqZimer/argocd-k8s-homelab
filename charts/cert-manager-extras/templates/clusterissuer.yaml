apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.acmeEmail }}
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            email: {{ .Values.cloudflareEmail }}
            apiTokenSecretRef:
              name: cert-manager-token
              key: api-token
        selector:
          dnsZones:
            - {{ .Values.clusterDomain | quote }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.acmeEmail }}
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          cloudflare:
            email: {{ .Values.cloudflareEmail }}
            apiTokenSecretRef:
              name: cert-manager-token
              key: api-token
        selector:
          dnsZones:
            - {{ .Values.clusterDomain | quote }}
